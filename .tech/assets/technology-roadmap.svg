<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1080" viewBox="0 0 1680 1080" role="img" aria-labelledby="title desc">
  <title id="title">Backlog technology roadmap</title>
  <desc id="desc">A roadmap-style visualisation of the Backlog technology knowledge graph, grouped into foundations, shared stack, product channels, and development tooling.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#121a2f"/>
      <stop offset="1" stop-color="#101828"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#172033"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="candidate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#304c89"/>
      <stop offset="1" stop-color="#24304f"/>
    </linearGradient>
    <linearGradient id="adopted" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#23865f"/>
      <stop offset="1" stop-color="#175c43"/>
    </linearGradient>
    <linearGradient id="foundation" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a4f17"/>
      <stop offset="1" stop-color="#433018"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.30"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#93a4c7"/>
    </marker>
    <style>
      .title { font: 800 44px Segoe UI, Inter, Arial, sans-serif; fill: #f8fafc; letter-spacing: -0.8px; }
      .subtitle { font: 400 19px Segoe UI, Inter, Arial, sans-serif; fill: #b8c4dd; }
      .section-title { font: 800 22px Segoe UI, Inter, Arial, sans-serif; fill: #f8fafc; letter-spacing: 0.2px; }
      .section-caption { font: 400 13px Segoe UI, Inter, Arial, sans-serif; fill: #9fb0ce; }
      .card-title { font: 700 15px Segoe UI, Inter, Arial, sans-serif; fill: #f8fafc; }
      .card-note { font: 400 12px Segoe UI, Inter, Arial, sans-serif; fill: #cbd5e1; }
      .lane { fill: url(#panel); stroke: #34435f; stroke-width: 1.2; rx: 28; filter: url(#shadow); }
      .card { stroke: rgba(255,255,255,0.22); stroke-width: 1; rx: 15; }
      .candidate { fill: url(#candidate); }
      .adopted { fill: url(#adopted); }
      .foundation { fill: url(#foundation); }
      .edge { stroke: #93a4c7; stroke-width: 2.2; fill: none; stroke-linecap: round; marker-end: url(#arrow); opacity: 0.72; }
      .soft-edge { stroke: #65748f; stroke-width: 1.5; fill: none; stroke-dasharray: 7 7; marker-end: url(#arrow); opacity: 0.55; }
      .chip { fill: rgba(255,255,255,0.08); stroke: rgba(255,255,255,0.18); stroke-width: 1; rx: 14; }
      .chip-text { font: 700 12px Segoe UI, Inter, Arial, sans-serif; fill: #dbeafe; text-transform: uppercase; letter-spacing: 1px; }
    </style>
  </defs>

  <rect width="1680" height="1080" fill="url(#bg)"/>
  <circle cx="1500" cy="90" r="220" fill="#243b6b" opacity="0.18"/>
  <circle cx="120" cy="990" r="280" fill="#1f7a5a" opacity="0.12"/>

  <text x="64" y="76" class="title">Backlog technology roadmap</text>
  <text x="64" y="110" class="subtitle">Readable UI view of .tech: foundations feed the shared stack, product channels, and the tooling used to build and govern the repository.</text>

  <rect x="1200" y="52" width="110" height="28" class="chip"/>
  <circle cx="1220" cy="66" r="6" fill="#23865f"/>
  <text x="1234" y="70" class="chip-text">Adopted</text>
  <rect x="1324" y="52" width="122" height="28" class="chip"/>
  <circle cx="1344" cy="66" r="6" fill="#4169c8"/>
  <text x="1358" y="70" class="chip-text">Candidate</text>
  <rect x="1460" y="52" width="140" height="28" class="chip"/>
  <circle cx="1480" cy="66" r="6" fill="#b7791f"/>
  <text x="1494" y="70" class="chip-text">Foundation</text>

  <rect x="48" y="156" width="300" height="822" class="lane"/>
  <text x="78" y="202" class="section-title">Foundations</text>
  <text x="78" y="226" class="section-caption">External platforms, base formats, and hosts</text>

  <rect x="82" y="254" width="104" height="54" class="card adopted"/><text x="102" y="286" class="card-title">Markdown</text>
  <rect x="202" y="254" width="104" height="54" class="card adopted"/><text x="238" y="286" class="card-title">JSON</text>
  <rect x="82" y="326" width="104" height="54" class="card adopted"/><text x="119" y="358" class="card-title">YAML</text>
  <rect x="202" y="326" width="104" height="54" class="card adopted"/><text x="238" y="358" class="card-title">Git</text>
  <rect x="82" y="410" width="224" height="62" class="card adopted"/><text x="127" y="444" class="card-title">GitHub Platform</text>
  <rect x="82" y="502" width="104" height="58" class="card foundation"/><text x="105" y="536" class="card-title">Windows</text>
  <rect x="202" y="502" width="104" height="58" class="card foundation"/><text x="225" y="536" class="card-title">Android</text>
  <rect x="82" y="590" width="224" height="58" class="card foundation"/><text x="124" y="624" class="card-title">Azure Cosmos DB</text>
  <rect x="82" y="666" width="224" height="58" class="card foundation"/><text x="137" y="700" class="card-title">Azure Key Vault</text>
  <rect x="82" y="742" width="224" height="58" class="card foundation"/><text x="111" y="776" class="card-title">Firebase Cloud Messaging</text>
  <rect x="82" y="830" width="224" height="74" class="card foundation"/><text x="112" y="862" class="card-title">Anthropic Claude</text><text x="130" y="884" class="card-note">candidate usage import</text>

  <rect x="406" y="156" width="330" height="822" class="lane"/>
  <text x="436" y="202" class="section-title">Shared stack</text>
  <text x="436" y="226" class="section-caption">Technologies reused by more than one channel</text>

  <rect x="446" y="254" width="250" height="64" class="card candidate"/><text x="504" y="286" class="card-title">.NET Runtime 10.0</text><text x="512" y="306" class="card-note">managed runtime baseline</text>
  <rect x="446" y="340" width="112" height="56" class="card candidate"/><text x="491" y="374" class="card-title">C#</text>
  <rect x="584" y="340" width="112" height="56" class="card candidate"/><text x="614" y="374" class="card-title">Node.js</text>
  <rect x="446" y="418" width="250" height="64" class="card candidate"/><text x="522" y="450" class="card-title">TypeScript</text><text x="494" y="470" class="card-note">VS Code and tooling</text>
  <rect x="446" y="524" width="250" height="64" class="card adopted"/><text x="524" y="556" class="card-title">.NET MAUI</text><text x="498" y="576" class="card-note">native desktop and mobile shell</text>
  <rect x="446" y="610" width="250" height="64" class="card adopted"/><text x="517" y="642" class="card-title">Blazor Hybrid</text><text x="500" y="662" class="card-note">Razor UI in native shell</text>
  <rect x="446" y="716" width="250" height="64" class="card adopted"/><text x="527" y="748" class="card-title">Mermaid</text><text x="501" y="768" class="card-note">text diagram fallback</text>
  <rect x="446" y="820" width="250" height="64" class="card candidate"/><text x="496" y="852" class="card-title">Copilot Usage APIs</text><text x="496" y="872" class="card-note">organization-scoped telemetry</text>

  <rect x="796" y="156" width="512" height="822" class="lane"/>
  <text x="826" y="202" class="section-title">Product channels</text>
  <text x="826" y="226" class="section-caption">The runtime surfaces that make up the Backlog product</text>

  <rect x="834" y="258" width="210" height="248" class="card candidate" opacity="0.35"/>
  <text x="862" y="292" class="section-title">Desktop</text>
  <text x="862" y="316" class="section-caption">local-first Windows client</text>
  <rect x="862" y="338" width="154" height="38" class="card candidate"/><text x="887" y="363" class="card-title">Windows App SDK</text>
  <rect x="862" y="388" width="154" height="38" class="card adopted"/><text x="913" y="413" class="card-title">WinUI 3</text>
  <rect x="862" y="438" width="154" height="38" class="card adopted"/><text x="886" y="463" class="card-title">MSIX + Installer</text>

  <rect x="1066" y="258" width="204" height="248" class="card candidate" opacity="0.35"/>
  <text x="1094" y="292" class="section-title">Mobile</text>
  <text x="1094" y="316" class="section-caption">Android capture/review</text>
  <rect x="1094" y="338" width="148" height="38" class="card foundation"/><text x="1139" y="363" class="card-title">Android</text>
  <rect x="1094" y="388" width="148" height="38" class="card candidate"/><text x="1115" y="413" class="card-title">Offline Store</text>
  <rect x="1094" y="438" width="148" height="38" class="card adopted"/><text x="1120" y="463" class="card-title">MAUI shell</text>

  <rect x="834" y="548" width="210" height="286" class="card candidate" opacity="0.35"/>
  <text x="862" y="582" class="section-title">IDE</text>
  <text x="862" y="606" class="section-caption">editor extensions</text>
  <rect x="862" y="628" width="154" height="38" class="card candidate"/><text x="879" y="653" class="card-title">VS Code API</text>
  <rect x="862" y="678" width="154" height="38" class="card candidate"/><text x="895" y="703" class="card-title">Webview UI</text>
  <rect x="862" y="728" width="154" height="38" class="card candidate"/><text x="888" y="753" class="card-title">VS Extensibility</text>
  <rect x="862" y="778" width="154" height="38" class="card candidate"/><text x="922" y="803" class="card-title">WPF</text>

  <rect x="1066" y="548" width="204" height="286" class="card candidate" opacity="0.35"/>
  <text x="1094" y="582" class="section-title">Cloud</text>
  <text x="1094" y="606" class="section-caption">thin Azure sync service</text>
  <rect x="1094" y="628" width="148" height="38" class="card candidate"/><text x="1112" y="653" class="card-title">Minimal APIs</text>
  <rect x="1094" y="678" width="148" height="38" class="card candidate"/><text x="1128" y="703" class="card-title">Aspire</text>
  <rect x="1094" y="728" width="148" height="38" class="card candidate"/><text x="1109" y="753" class="card-title">Container Apps</text>
  <rect x="1094" y="778" width="148" height="38" class="card foundation"/><text x="1101" y="803" class="card-title">Cosmos + Vault</text>

  <rect x="1368" y="156" width="264" height="822" class="lane"/>
  <text x="1398" y="202" class="section-title">Tooling</text>
  <text x="1398" y="226" class="section-caption">Build, governance, and AI workflow</text>

  <rect x="1400" y="254" width="200" height="50" class="card adopted"/><text x="1444" y="285" class="card-title">GitHub Actions</text>
  <rect x="1400" y="322" width="92" height="48" class="card adopted"/><text x="1424" y="352" class="card-title">CodeQL</text>
  <rect x="1508" y="322" width="92" height="48" class="card adopted"/><text x="1517" y="352" class="card-title">Dependabot</text>
  <rect x="1400" y="404" width="200" height="58" class="card adopted"/><text x="1432" y="438" class="card-title">GitHub Copilot CLI</text>
  <rect x="1400" y="496" width="200" height="58" class="card adopted"/><text x="1416" y="530" class="card-title">MCP Servers</text>
  <rect x="1400" y="576" width="200" height="58" class="card adopted"/><text x="1421" y="610" class="card-title">Knowledge Plugin</text>
  <rect x="1400" y="656" width="200" height="58" class="card adopted"/><text x="1420" y="690" class="card-title">Knowledge Canvas</text>
  <rect x="1400" y="750" width="92" height="48" class="card candidate"/><text x="1412" y="780" class="card-title">.NET SDK</text>
  <rect x="1508" y="750" width="92" height="48" class="card candidate"/><text x="1531" y="780" class="card-title">NuGet</text>
  <rect x="1400" y="816" width="92" height="48" class="card candidate"/><text x="1430" y="846" class="card-title">npm</text>
  <rect x="1508" y="816" width="92" height="48" class="card candidate"/><text x="1522" y="846" class="card-title">Aspire CLI</text>

