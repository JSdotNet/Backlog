<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- The Backlog mark: "the pile".

     Three left-aligned pills that widen as they descend and brighten as they
     rise. The narrow bright pill on top is the item being worked; the widening,
     dimming pills beneath it are the queue growing underneath.

     Every fill is a brand token from .design/color-scheme.md - primary-light,
     primary, primary-dark - so the mark carries no colour the palette has not
     already sanctioned.

     All ink sits within radius 135.7 of the canvas centre (228,228), inside the
     139.5 Android adaptive-icon safe radius, so no launcher mask crops it. Each
     bar is a true pill: rx is exactly half the height. -->
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <rect x="113" y="144" width="134" height="34" rx="17" fill="#FFD166" />
    <rect x="113" y="218" width="182" height="34" rx="17" fill="#F2C14E" />
    <rect x="113" y="278" width="230" height="34" rx="17" fill="#D4A72C" />
</svg>
