name: Deploy All

# One run that takes the whole cloud-and-client side of Backlog out: the Azure AI
# Foundry models, the cloud sync tier's infrastructure, and the release -- the desktop
# MSIX, the Android APK and the sync service, under one number.
#
# It owns no deployment logic. Each component is the workflow that already deployed
# it, called as a reusable workflow, so a component behaves identically whether it
# is run on its own or from here. Changing how sync deploys still means editing
# deploy-sync.yml and nothing else.
#
# The release component is Release All (release-all.yml), which numbers the release
# from the tags already published. Leave release_version blank and it takes the next
# number, exactly as its nightly does; see docs/deployment/all.md. The sync service
# belongs to the release, so the sync component here is the infrastructure alone:
# otherwise one run would deploy the service twice, under two versions.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'How far to take the infrastructure components'
        required: true
        default: what-if
        type: choice
        options:
          # Nothing is created or changed. Foundry validates and previews; sync
          # runs `azd provision --preview`; the release is dropped with a notice,
          # because there is no dry run of publishing a release.
          - what-if
          # Infrastructure is provisioned for real. The release is still dropped.
          - provision
          # Everything selected below actually deploys; sync's share of that is
          # its infrastructure, and the release deploys its service.
          - deploy
      components:
        description: 'Which components to run'
        required: true
        default: foundry+sync
        type: choice
        options:
          - foundry+sync
          - foundry+sync+release
          - foundry
          - sync
          - release
      foundry_environment:
        description: 'GitHub environment for Foundry; also selects infra/foundry/<name>.bicepparam'
        required: true
        default: backlog-ai
        type: string
      sync_environment:
        description: 'GitHub environment for sync; also names the azd environment'
        required: true
        default: backlog-sync
        type: string
      release_version:
        description: 'Release version of both apps without the leading v (e.g. 1.2.3); blank releases the next number'
        required: false
        default: ''
        type: string
      include_embedding_model:
        description: 'Foundry: deploy text-embedding-3-small, which backs knowledge search by meaning'
        required: true
        default: from-parameter-file
        type: choice
        options:
          - from-parameter-file
          - "true"
          - "false"
      include_speech_model:
        description: 'Foundry: deploy gpt-4o-transcribe speech-to-text'
        required: true
        default: from-parameter-file
        type: choice
        options:
          - from-parameter-file
          - "true"
          - "false"
      include_balanced_model:
        description: 'Foundry: deploy the optional gpt-5.6-sol balanced alternative'
        required: true
        default: from-parameter-file
        type: choice
        options:
          - from-parameter-file
          - "true"
          - "false"

permissions:
  contents: read

# One combined run at a time. Component-level concurrency still applies inside the
# called workflows, so a combined run and a standalone run of the same component
# queue behind each other rather than racing.
concurrency:
  group: deploy-all
  cancel-in-progress: false

jobs:
  # Turns the two choice inputs into per-component booleans once, so no other job
  # repeats the string matching.
  plan:
    name: Plan the run
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      foundry: ${{ steps.select.outputs.foundry }}
      sync: ${{ steps.select.outputs.sync }}
      release: ${{ steps.select.outputs.release }}
      foundry_mode: ${{ steps.select.outputs.foundry_mode }}
      sync_mode: ${{ steps.select.outputs.sync_mode }}
    steps:
      - name: Select components and per-component modes
        id: select
        shell: pwsh
        env:
          COMPONENTS: ${{ inputs.components }}
          MODE: ${{ inputs.mode }}
        run: |
          $ErrorActionPreference = 'Stop'

          # Validated before either switch below, so an unrecognised mode cannot
          # fall through them as $null -- which would leave every mode-gated step
          # in the called workflows false and report a green run that deployed
          # nothing.
          if ($env:MODE -notin @('what-if', 'provision', 'deploy')) {
            Write-Output "::error::Unknown mode '$env:MODE'."
            exit 1
          }

          $selected = $env:COMPONENTS -split '\+'

          $foundry = $selected -contains 'foundry'
          $sync    = $selected -contains 'sync'
          $release = $selected -contains 'release'

          # Publishing a release has no dry run, so the release only takes part in
          # a full deploy. Drop it out loud rather than failing the run: the other
          # components still have a preview worth showing.
          if ($release -and $env:MODE -ne 'deploy') {
            Write-Output "::notice::Dropping the release component. Mode is '$env:MODE', and publishing a release has no what-if or provision equivalent. Re-run with mode 'deploy' to ship it."
            $release = $false
          }

          if (-not ($foundry -or $sync -or $release)) {
            Write-Output "::error::Nothing left to run: components '$env:COMPONENTS' in mode '$env:MODE' selects no component."
            exit 1
          }

          # The two infrastructure workflows spell their modes differently: Foundry
          # has validate/what-if/deploy, sync has preview/provision/deploy.
          $foundryMode = switch ($env:MODE) {
            'what-if'   { 'what-if' }
            'provision' { 'deploy' }
            'deploy'    { 'deploy' }
          }
          # Sync never maps to Deploy Sync's 'deploy': the service is the release
          # component's, deployed by Release All under the release number.
          $syncMode = switch ($env:MODE) {
            'what-if'   { 'preview' }
            'provision' { 'provision' }
            'deploy'    { 'provision' }
          }

          @(
            "foundry=$($foundry.ToString().ToLowerInvariant())"
            "sync=$($sync.ToString().ToLowerInvariant())"
            "release=$($release.ToString().ToLowerInvariant())"
            "foundry_mode=$foundryMode"
            "sync_mode=$syncMode"
          ) | Add-Content -LiteralPath $env:GITHUB_OUTPUT

          Write-Output "foundry=$foundry ($foundryMode) sync=$sync ($syncMode) release=$release"

  # Foundry and sync are independent: different resource groups, different runners,
  # different lifecycles. They run in parallel.
  foundry:
    name: Foundry
    needs: plan
    if: needs.plan.outputs.foundry == 'true'
    uses: ./.github/workflows/deploy-foundry.yml
    permissions:
      contents: read
    with:
      mode: ${{ needs.plan.outputs.foundry_mode }}
      environment_name: ${{ inputs.foundry_environment }}
      include_balanced_model: ${{ inputs.include_balanced_model }}
      include_embedding_model: ${{ inputs.include_embedding_model }}
      include_speech_model: ${{ inputs.include_speech_model }}

  sync:
    name: Sync
    needs: plan
    if: needs.plan.outputs.sync == 'true'
    uses: ./.github/workflows/deploy-sync.yml
    permissions:
      contents: read
      id-token: write
    # Inherit rather than pass by name: SYNC_TOKEN_SIGNING_KEY is an *environment*
    # secret, and this job has no environment to resolve it in — the called
    # workflow's job does. Sync runs on a GitHub-hosted runner, so the concern
    # that keeps Foundry off `inherit` (a self-hosted runner pre-authorised for
    # every secret) does not apply here.
    secrets: inherit
    with:
      mode: ${{ needs.plan.outputs.sync_mode }}
      environment_name: ${{ inputs.sync_environment }}

  # Both apps talk to both tiers, so the release ships last and only once neither
  # of them failed. `always()` is what lets a component that was not selected --
  # and so reports 'skipped' -- pass this gate, while a real failure does not.
  release:
    name: Release All
    needs: [plan, foundry, sync]
    if: >-
      !cancelled()
      && needs.plan.outputs.release == 'true'
      && needs.foundry.result != 'failure'
      && needs.foundry.result != 'cancelled'
      && needs.sync.result != 'failure'
      && needs.sync.result != 'cancelled'
    uses: ./.github/workflows/release-all.yml
    permissions:
      contents: write
      issues: write
      # Release All deploys the sync service through Deploy Sync, which signs in
      # with the OIDC federated credential; a called workflow can never hold more
      # than this job grants it.
      id-token: write
    secrets: inherit
    with:
      version: ${{ inputs.release_version }}
      # The environment the sync component provisioned, so the service lands there too.
      sync_environment: ${{ inputs.sync_environment }}

  summary:
    name: Summary
    needs: [plan, foundry, sync, release]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Write combined summary
        shell: pwsh
        env:
          MODE: ${{ inputs.mode }}
          COMPONENTS: ${{ inputs.components }}
          FOUNDRY_SELECTED: ${{ needs.plan.outputs.foundry }}
          SYNC_SELECTED: ${{ needs.plan.outputs.sync }}
          RELEASE_SELECTED: ${{ needs.plan.outputs.release }}
          FOUNDRY_RESULT: ${{ needs.foundry.result }}
          SYNC_RESULT: ${{ needs.sync.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
          FOUNDRY_ENDPOINT: ${{ needs.foundry.outputs.endpoint }}
          FOUNDRY_CHAT_DEPLOYMENT: ${{ needs.foundry.outputs.chat_deployment }}
          FOUNDRY_EMBEDDING_DEPLOYMENT: ${{ needs.foundry.outputs.embedding_deployment }}
          SYNC_ENDPOINT: ${{ needs.sync.outputs.endpoint }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'

          # 'skipped' means two different things: the component was never
          # selected, or it was selected and its `if:` gated it out because an
          # upstream component failed. Reporting both as 'not selected' next to a
          # FAILED row reads like the user's mistake.
          function Format-Result([string] $result, [string] $detail, [string] $selected) {
            $text = switch ($result) {
              'success'   { 'succeeded' }
              'failure'   { 'FAILED' }
              'cancelled' { 'cancelled' }
              'skipped'   {
                if ($selected -eq 'true') { 'not run - an upstream component failed' }
                else { 'not selected for this run' }
              }
              default     { $result }
            }
            if ($detail) { return "$text - $detail" }
            return $text
          }

          @(
            "### Deploy All"
            ""
            "- Mode: ``$env:MODE``"
            "- Components: ``$env:COMPONENTS``"
            ""
            "| Component | Result |"
            "| --- | --- |"
            "| Foundry | $(Format-Result $env:FOUNDRY_RESULT $env:FOUNDRY_ENDPOINT $env:FOUNDRY_SELECTED) |"
            "| Sync infrastructure | $(Format-Result $env:SYNC_RESULT $env:SYNC_ENDPOINT $env:SYNC_SELECTED) |"
            "| Release (desktop + mobile + sync service) | $(Format-Result $env:RELEASE_RESULT $env:RELEASE_TAG $env:RELEASE_SELECTED) |"
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

          if ($env:FOUNDRY_ENDPOINT) {
            @(
              ""
              "#### Enable the AI features"
              ""
              "In the desktop app, Settings -> Azure Foundry:"
              ""
              "| Field | Value |"
              "| --- | --- |"
              "| Endpoint | ``$env:FOUNDRY_ENDPOINT`` |"
              "| Deployment | ``$env:FOUNDRY_CHAT_DEPLOYMENT`` |"
              ""
              "The API key is not printed here; the Foundry job's own summary carries the command that reads it."
            ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

            if ($env:FOUNDRY_EMBEDDING_DEPLOYMENT) {
              "" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
              "Knowledge search by meaning uses ``$env:FOUNDRY_EMBEDDING_DEPLOYMENT`` on the same endpoint." |
                Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            }
          }
