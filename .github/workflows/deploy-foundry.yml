name: Deploy Foundry

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Validation mode to run'
        required: true
        default: what-if
        type: choice
        options:
          - validate
          - what-if
          - deploy
      environment_name:
        description: 'GitHub environment containing Azure OIDC variables'
        required: true
        default: playground
        type: string
      subscription_id:
        description: 'Azure subscription ID'
        required: true
        default: 8b559814-3419-498f-8d8d-1bd4ea69b15c
        type: string
      resource_group:
        description: 'Azure resource group'
        required: true
        default: JS-Backlog
        type: string
      foundry_account_name:
        description: 'Azure AI Services / Foundry resource name'
        required: true
        default: backlog-foundry
        type: string
      location:
        description: 'Optional Azure region override; blank uses the resource group location'
        required: false
        default: ''
        type: string
      include_balanced_model:
        description: 'Deploy optional gpt-5.6-sol balanced alternative'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-foundry-${{ inputs.environment_name }}
  cancel-in-progress: false

jobs:
  foundry:
    name: Validate and deploy Foundry
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check workflow configuration
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          FOUNDRY_ACCOUNT_NAME: ${{ inputs.foundry_account_name }}
        run: |
          set -euo pipefail

          if [[ -z "$AZURE_CLIENT_ID" ]]; then
            echo "::error::GitHub environment variable AZURE_CLIENT_ID is not set."
            exit 1
          fi

          if [[ -z "$AZURE_TENANT_ID" ]]; then
            echo "::error::GitHub environment variable AZURE_TENANT_ID is not set."
            exit 1
          fi

          if [[ ! "$FOUNDRY_ACCOUNT_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9-]{1,62}[A-Za-z0-9]$ ]]; then
            echo "::error::foundry_account_name must be 3-64 alphanumeric or hyphen characters and must start and end with an alphanumeric character."
            exit 1
          fi

      - name: Azure login
        uses: Azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ inputs.subscription_id }}

      - name: Build Bicep template
        run: az bicep build --file infra/foundry/main.bicep

      - name: Validate deployment
        shell: bash
        env:
          FOUNDRY_ACCOUNT_NAME: ${{ inputs.foundry_account_name }}
          INCLUDE_BALANCED_MODEL: ${{ inputs.include_balanced_model }}
          LOCATION: ${{ inputs.location }}
          RESOURCE_GROUP: ${{ inputs.resource_group }}
        run: |
          set -euo pipefail

          parameters=(
            "infra/foundry/playground.bicepparam"
            "accountName=$FOUNDRY_ACCOUNT_NAME"
            "includeBalancedModel=$INCLUDE_BALANCED_MODEL"
          )

          if [[ -n "$LOCATION" ]]; then
            parameters+=("location=$LOCATION")
          fi

          az deployment group validate \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/foundry/main.bicep \
            --parameters "${parameters[@]}"

      - name: Preview deployment
        if: inputs.mode == 'what-if' || inputs.mode == 'deploy'
        shell: bash
        env:
          FOUNDRY_ACCOUNT_NAME: ${{ inputs.foundry_account_name }}
          INCLUDE_BALANCED_MODEL: ${{ inputs.include_balanced_model }}
          LOCATION: ${{ inputs.location }}
          RESOURCE_GROUP: ${{ inputs.resource_group }}
        run: |
          set -euo pipefail

          parameters=(
            "infra/foundry/playground.bicepparam"
            "accountName=$FOUNDRY_ACCOUNT_NAME"
            "includeBalancedModel=$INCLUDE_BALANCED_MODEL"
          )

          if [[ -n "$LOCATION" ]]; then
            parameters+=("location=$LOCATION")
          fi

          az deployment group what-if \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/foundry/main.bicep \
            --parameters "${parameters[@]}"

      - name: Deploy Foundry resources
        if: inputs.mode == 'deploy'
        shell: bash
        env:
          FOUNDRY_ACCOUNT_NAME: ${{ inputs.foundry_account_name }}
          INCLUDE_BALANCED_MODEL: ${{ inputs.include_balanced_model }}
          LOCATION: ${{ inputs.location }}
          RESOURCE_GROUP: ${{ inputs.resource_group }}
        run: |
          set -euo pipefail

          parameters=(
            "infra/foundry/playground.bicepparam"
            "accountName=$FOUNDRY_ACCOUNT_NAME"
            "includeBalancedModel=$INCLUDE_BALANCED_MODEL"
          )

          if [[ -n "$LOCATION" ]]; then
            parameters+=("location=$LOCATION")
          fi

          az deployment group create \
            --name "backlog-foundry-${{ github.run_number }}" \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/foundry/main.bicep \
            --parameters "${parameters[@]}"

      - name: Write deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Foundry deployment"
            echo ""
            echo "- Mode: \`${{ inputs.mode }}\`"
            echo "- Subscription: \`${{ inputs.subscription_id }}\`"
            echo "- Resource group: \`${{ inputs.resource_group }}\`"
            echo "- Foundry account: \`${{ inputs.foundry_account_name }}\`"
            echo "- Optional balanced model: \`${{ inputs.include_balanced_model }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
