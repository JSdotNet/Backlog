name: Deploy Foundry

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Validation mode to run'
        required: true
        default: what-if
        type: choice
        options:
          - validate
          - what-if
          - deploy
      environment_name:
        description: 'GitHub environment; also selects infra/foundry/<environment_name>.bicepparam'
        required: true
        default: backlog-ai
        type: string
      subscription_id:
        description: 'Subscription to deploy to; blank uses the environment variable AZURE_SUBSCRIPTION_ID'
        required: false
        default: 8235e3b9-4cd0-4426-879a-471503d9e4fc
        type: string
      resource_group:
        description: 'Resource group to deploy to; blank uses the environment variable AZURE_RESOURCE_GROUP'
        required: false
        default: JS-AI
        type: string
      foundry_account_name:
        description: 'Optional Foundry resource name override; blank uses the parameter file value'
        required: false
        default: ''
        type: string
      location:
        description: 'Optional Azure region override; blank uses the parameter file value or the resource group location'
        required: false
        default: ''
        type: string
      include_balanced_model:
        description: 'Deploy optional gpt-5.6-sol balanced alternative'
        required: true
        default: from-parameter-file
        type: choice
        options:
          - from-parameter-file
          - "true"
          - "false"
      include_embedding_model:
        description: 'Deploy optional text-embedding-3-small model that backs knowledge search by meaning'
        required: true
        default: from-parameter-file
        type: choice
        options:
          - from-parameter-file
          - "true"
          - "false"
      include_speech_model:
        description: 'Deploy optional gpt-4o-transcribe speech-to-text model'
        required: true
        default: from-parameter-file
        type: choice
        options:
          - from-parameter-file
          - "true"
          - "false"

  # Called by Deploy All. The inputs mirror workflow_dispatch one for one, as
  # strings rather than choices, because workflow_call has no choice type. The
  # same `inputs.*` expressions below serve both triggers.
  workflow_call:
    inputs:
      mode:
        required: false
        default: what-if
        type: string
      environment_name:
        required: false
        default: backlog-ai
        type: string
      subscription_id:
        required: false
        default: 8235e3b9-4cd0-4426-879a-471503d9e4fc
        type: string
      resource_group:
        required: false
        default: JS-AI
        type: string
      foundry_account_name:
        required: false
        default: ''
        type: string
      location:
        required: false
        default: ''
        type: string
      include_balanced_model:
        required: false
        default: from-parameter-file
        type: string
      include_embedding_model:
        required: false
        default: from-parameter-file
        type: string
      include_speech_model:
        required: false
        default: from-parameter-file
        type: string
    outputs:
      endpoint:
        description: 'Foundry account endpoint to paste into the desktop AI settings'
        value: ${{ jobs.foundry.outputs.endpoint }}
      chat_deployment:
        description: 'Name of the default chat deployment'
        value: ${{ jobs.foundry.outputs.chat_deployment }}
      embedding_deployment:
        description: 'Name of the embedding deployment, empty when it was not deployed'
        value: ${{ jobs.foundry.outputs.embedding_deployment }}

permissions:
  contents: read

concurrency:
  group: deploy-foundry-${{ inputs.environment_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  foundry:
    name: Validate and deploy Foundry
    runs-on: [self-hosted]
    environment: ${{ inputs.environment_name }}
    permissions:
      contents: read
    outputs:
      endpoint: ${{ steps.connection.outputs.endpoint }}
      chat_deployment: ${{ steps.connection.outputs.chat_deployment }}
      embedding_deployment: ${{ steps.connection.outputs.embedding_deployment }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve deployment target
        env:
          ENVIRONMENT_NAME: ${{ inputs.environment_name }}
          SUBSCRIPTION_ID_INPUT: ${{ inputs.subscription_id }}
          SUBSCRIPTION_ID_VAR: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          RESOURCE_GROUP_INPUT: ${{ inputs.resource_group }}
          RESOURCE_GROUP_VAR: ${{ vars.AZURE_RESOURCE_GROUP }}
          FOUNDRY_ACCOUNT_NAME: ${{ inputs.foundry_account_name }}
          LOCATION: ${{ inputs.location }}
          INCLUDE_BALANCED_MODEL: ${{ inputs.include_balanced_model }}
          INCLUDE_EMBEDDING_MODEL: ${{ inputs.include_embedding_model }}
          INCLUDE_SPEECH_MODEL: ${{ inputs.include_speech_model }}
        run: |
          $ErrorActionPreference = 'Stop'

          $parameterFile = "infra/foundry/$env:ENVIRONMENT_NAME.bicepparam"
          if (-not (Test-Path -LiteralPath $parameterFile)) {
            Write-Output "::error::Parameter file $parameterFile does not exist. Add one for environment $env:ENVIRONMENT_NAME before deploying to its subscription."
            exit 1
          }

          $subscriptionId = if ($env:SUBSCRIPTION_ID_INPUT) { $env:SUBSCRIPTION_ID_INPUT } else { $env:SUBSCRIPTION_ID_VAR }
          if (-not $subscriptionId) {
            Write-Output "::error::No subscription target. Set the GitHub environment variable AZURE_SUBSCRIPTION_ID for $env:ENVIRONMENT_NAME, or pass the subscription_id input."
            exit 1
          }

          if ($subscriptionId -notmatch '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$') {
            Write-Output "::error::subscription_id must be a GUID."
            exit 1
          }

          $resourceGroup = if ($env:RESOURCE_GROUP_INPUT) { $env:RESOURCE_GROUP_INPUT } else { $env:RESOURCE_GROUP_VAR }
          if (-not $resourceGroup) {
            Write-Output "::error::No resource group target. Set the GitHub environment variable AZURE_RESOURCE_GROUP for $env:ENVIRONMENT_NAME, or pass the resource_group input."
            exit 1
          }

          if ($resourceGroup -notmatch '^[A-Za-z0-9._()-]{1,90}$') {
            Write-Output "::error::resource_group contains characters that Azure does not allow in a resource group name."
            exit 1
          }

          $overrides = @()

          if ($env:FOUNDRY_ACCOUNT_NAME) {
            if ($env:FOUNDRY_ACCOUNT_NAME -notmatch '^[A-Za-z0-9][A-Za-z0-9-]{1,62}[A-Za-z0-9]$') {
              Write-Output "::error::foundry_account_name must be 3-64 alphanumeric or hyphen characters and must start and end with an alphanumeric character."
              exit 1
            }
            $overrides += "accountName=$env:FOUNDRY_ACCOUNT_NAME"
          }

          if ($env:LOCATION) {
            if ($env:LOCATION -notmatch '^[a-z0-9]{2,40}$') {
              Write-Output "::error::location must be an Azure region short name, for example swedencentral."
              exit 1
            }
            $overrides += "location=$env:LOCATION"
          }

          if ($env:INCLUDE_BALANCED_MODEL -ne 'from-parameter-file') {
            $overrides += "includeBalancedModel=$env:INCLUDE_BALANCED_MODEL"
          }

          if ($env:INCLUDE_EMBEDDING_MODEL -ne 'from-parameter-file') {
            $overrides += "includeEmbeddingModel=$env:INCLUDE_EMBEDDING_MODEL"
          }

          if ($env:INCLUDE_SPEECH_MODEL -ne 'from-parameter-file') {
            $overrides += "includeSpeechModel=$env:INCLUDE_SPEECH_MODEL"
          }

          @(
            "AZURE_SUBSCRIPTION_ID=$subscriptionId"
            "AZURE_RESOURCE_GROUP=$resourceGroup"
            "FOUNDRY_PARAMETER_FILE=$parameterFile"
            "FOUNDRY_PARAMETER_OVERRIDES=$($overrides -join ' ')"
          ) | Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Select Azure subscription
        run: |
          $ErrorActionPreference = 'Stop'

          # The self-hosted runner supplies Azure access; this workflow never signs in itself.
          az account show --output none 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error::The self-hosted runner is not signed in to Azure. Run 'az login --tenant innovadis.com' as the runner service account, or attach a managed identity, then re-run."
            exit 1
          }

          az account set --subscription $env:AZURE_SUBSCRIPTION_ID
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error::The runner identity cannot access subscription $env:AZURE_SUBSCRIPTION_ID."
            exit 1
          }

          az account show --query "{subscription:name, subscriptionId:id, tenantId:tenantId, user:user.name}" --output table

      - name: Build Bicep template
        run: |
          $ErrorActionPreference = 'Stop'

          az bicep build --file infra/foundry/main.bicep
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Validate deployment
        run: |
          $ErrorActionPreference = 'Stop'

          $overrides = if ($env:FOUNDRY_PARAMETER_OVERRIDES) { $env:FOUNDRY_PARAMETER_OVERRIDES -split ' +' } else { @() }

          az deployment group validate `
            --subscription $env:AZURE_SUBSCRIPTION_ID `
            --resource-group $env:AZURE_RESOURCE_GROUP `
            --template-file infra/foundry/main.bicep `
            --parameters $env:FOUNDRY_PARAMETER_FILE @overrides
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Preview deployment
        if: inputs.mode == 'what-if' || inputs.mode == 'deploy'
        run: |
          $ErrorActionPreference = 'Stop'

          $overrides = if ($env:FOUNDRY_PARAMETER_OVERRIDES) { $env:FOUNDRY_PARAMETER_OVERRIDES -split ' +' } else { @() }

          az deployment group what-if `
            --subscription $env:AZURE_SUBSCRIPTION_ID `
            --resource-group $env:AZURE_RESOURCE_GROUP `
            --template-file infra/foundry/main.bicep `
            --parameters $env:FOUNDRY_PARAMETER_FILE @overrides
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Deploy Foundry resources
        if: inputs.mode == 'deploy'
        run: |
          $ErrorActionPreference = 'Stop'

          $overrides = if ($env:FOUNDRY_PARAMETER_OVERRIDES) { $env:FOUNDRY_PARAMETER_OVERRIDES -split ' +' } else { @() }

          az deployment group create `
            --name "backlog-foundry-${{ github.run_id }}" `
            --subscription $env:AZURE_SUBSCRIPTION_ID `
            --resource-group $env:AZURE_RESOURCE_GROUP `
            --template-file infra/foundry/main.bicep `
            --parameters $env:FOUNDRY_PARAMETER_FILE @overrides
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Read back the AI connection
        id: connection
        if: inputs.mode == 'deploy'
        run: |
          $ErrorActionPreference = 'Stop'

          # Turning an AI feature on in the desktop app needs three values:
          # endpoint, deployment and key (AzureFoundrySettings.IsConfigured). The
          # first two are template outputs; the key is never printed and is fetched
          # by hand. Surfacing them here is what makes the deploy usable rather than
          # merely successful.
          $deployment = az deployment group show `
            --name "backlog-foundry-${{ github.run_id }}" `
            --subscription $env:AZURE_SUBSCRIPTION_ID `
            --resource-group $env:AZURE_RESOURCE_GROUP `
            --query properties.outputs `
            --output json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit 1 }

          # Without this the step writes empty outputs and exits 0: both summary
          # blocks then skip silently, and a deploy that cannot be turned into a
          # working connection reports success.
          if (-not $deployment -or -not $deployment.accountEndpoint.value) {
            Write-Output "::error::Deployment backlog-foundry-${{ github.run_id }} returned no accountEndpoint output, so the AI connection cannot be reported."
            exit 1
          }

          @(
            "endpoint=$($deployment.accountEndpoint.value)"
            "chat_deployment=$($deployment.chatDeploymentName.value)"
            "embedding_deployment=$($deployment.embeddingDeploymentName.value)"
            "account_name=$($deployment.accountName.value)"
          ) | Add-Content -LiteralPath $env:GITHUB_OUTPUT

      - name: Write deployment summary
        if: always()
        run: |
          $unresolved = 'unresolved'
          @(
            "### Foundry deployment"
            ""
            "- Runner: ``self-hosted``"
            "- Mode: ``${{ inputs.mode }}``"
            "- Environment: ``${{ inputs.environment_name }}``"
            "- Subscription: ``$(if ($env:AZURE_SUBSCRIPTION_ID) { $env:AZURE_SUBSCRIPTION_ID } else { $unresolved })``"
            "- Resource group: ``$(if ($env:AZURE_RESOURCE_GROUP) { $env:AZURE_RESOURCE_GROUP } else { $unresolved })``"
            "- Parameter file: ``$(if ($env:FOUNDRY_PARAMETER_FILE) { $env:FOUNDRY_PARAMETER_FILE } else { $unresolved })``"
            "- Parameter overrides: ``$(if ($env:FOUNDRY_PARAMETER_OVERRIDES) { $env:FOUNDRY_PARAMETER_OVERRIDES } else { 'none' })``"
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

          $endpoint = '${{ steps.connection.outputs.endpoint }}'
          if ($endpoint) {
            @(
              ""
              "#### Enable the AI features"
              ""
              "Open the desktop app, go to Settings -> Azure Foundry, and enter:"
              ""
              "| Field | Value |"
              "| --- | --- |"
              "| Endpoint | ``$endpoint`` |"
              "| Deployment | ``${{ steps.connection.outputs.chat_deployment }}`` |"
              "| API key | not printed here - see the command below |"
              ""
              "The key is deliberately not written to this summary. Read it with:"
              ""
              "``````powershell"
              "az cognitiveservices account keys list --name ${{ steps.connection.outputs.account_name }} --resource-group $env:AZURE_RESOURCE_GROUP --subscription $env:AZURE_SUBSCRIPTION_ID --query key1 --output tsv"
              "``````"
            ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

            $embedding = '${{ steps.connection.outputs.embedding_deployment }}'
            if ($embedding) {
              "" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
              "Knowledge search by meaning uses the ``$embedding`` deployment on the same endpoint." | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            }
          }
