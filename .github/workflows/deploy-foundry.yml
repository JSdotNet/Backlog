name: Deploy Foundry

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Validation mode to run'
        required: true
        default: what-if
        type: choice
        options:
          - validate
          - what-if
          - deploy
      environment_name:
        description: 'GitHub environment; also selects infra/foundry/<environment_name>.bicepparam'
        required: true
        default: backlog-ai
        type: string
      subscription_id:
        description: 'Optional subscription ID override; blank uses the environment variable AZURE_SUBSCRIPTION_ID'
        required: false
        default: ''
        type: string
      resource_group:
        description: 'Optional resource group override; blank uses the environment variable AZURE_RESOURCE_GROUP'
        required: false
        default: ''
        type: string
      foundry_account_name:
        description: 'Optional Foundry resource name override; blank uses the parameter file value'
        required: false
        default: ''
        type: string
      location:
        description: 'Optional Azure region override; blank uses the parameter file value or the resource group location'
        required: false
        default: ''
        type: string
      include_balanced_model:
        description: 'Deploy optional gpt-5.6-sol balanced alternative'
        required: true
        default: from-parameter-file
        type: choice
        options:
          - from-parameter-file
          - "true"
          - "false"
      include_speech_model:
        description: 'Deploy optional gpt-4o-transcribe speech-to-text model'
        required: true
        default: from-parameter-file
        type: choice
        options:
          - from-parameter-file
          - "true"
          - "false"

permissions:
  contents: read

concurrency:
  group: deploy-foundry-${{ inputs.environment_name }}
  cancel-in-progress: false

jobs:
  foundry:
    name: Validate and deploy Foundry
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve deployment target
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ENVIRONMENT_NAME: ${{ inputs.environment_name }}
          SUBSCRIPTION_ID_INPUT: ${{ inputs.subscription_id }}
          SUBSCRIPTION_ID_VAR: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          RESOURCE_GROUP_INPUT: ${{ inputs.resource_group }}
          RESOURCE_GROUP_VAR: ${{ vars.AZURE_RESOURCE_GROUP }}
          FOUNDRY_ACCOUNT_NAME: ${{ inputs.foundry_account_name }}
          LOCATION: ${{ inputs.location }}
          INCLUDE_BALANCED_MODEL: ${{ inputs.include_balanced_model }}
          INCLUDE_SPEECH_MODEL: ${{ inputs.include_speech_model }}
        run: |
          set -euo pipefail

          if [[ -z "$AZURE_CLIENT_ID" ]]; then
            echo "::error::GitHub environment variable AZURE_CLIENT_ID is not set for environment $ENVIRONMENT_NAME."
            exit 1
          fi

          if [[ -z "$AZURE_TENANT_ID" ]]; then
            echo "::error::GitHub environment variable AZURE_TENANT_ID is not set for environment $ENVIRONMENT_NAME."
            exit 1
          fi

          parameter_file="infra/foundry/${ENVIRONMENT_NAME}.bicepparam"
          if [[ ! -f "$parameter_file" ]]; then
            echo "::error::Parameter file $parameter_file does not exist. Add one for environment $ENVIRONMENT_NAME before deploying to its subscription."
            exit 1
          fi

          subscription_id="${SUBSCRIPTION_ID_INPUT:-$SUBSCRIPTION_ID_VAR}"
          if [[ -z "$subscription_id" ]]; then
            echo "::error::No subscription target. Set the GitHub environment variable AZURE_SUBSCRIPTION_ID for $ENVIRONMENT_NAME, or pass the subscription_id input."
            exit 1
          fi

          if [[ ! "$subscription_id" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "::error::subscription_id must be a GUID."
            exit 1
          fi

          resource_group="${RESOURCE_GROUP_INPUT:-$RESOURCE_GROUP_VAR}"
          if [[ -z "$resource_group" ]]; then
            echo "::error::No resource group target. Set the GitHub environment variable AZURE_RESOURCE_GROUP for $ENVIRONMENT_NAME, or pass the resource_group input."
            exit 1
          fi

          if [[ ! "$resource_group" =~ ^[A-Za-z0-9._()-]{1,90}$ ]]; then
            echo "::error::resource_group contains characters that Azure does not allow in a resource group name."
            exit 1
          fi

          overrides=()

          if [[ -n "$FOUNDRY_ACCOUNT_NAME" ]]; then
            if [[ ! "$FOUNDRY_ACCOUNT_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9-]{1,62}[A-Za-z0-9]$ ]]; then
              echo "::error::foundry_account_name must be 3-64 alphanumeric or hyphen characters and must start and end with an alphanumeric character."
              exit 1
            fi
            overrides+=("accountName=$FOUNDRY_ACCOUNT_NAME")
          fi

          if [[ -n "$LOCATION" ]]; then
            if [[ ! "$LOCATION" =~ ^[a-z0-9]{2,40}$ ]]; then
              echo "::error::location must be an Azure region short name, for example swedencentral."
              exit 1
            fi
            overrides+=("location=$LOCATION")
          fi

          if [[ "$INCLUDE_BALANCED_MODEL" != "from-parameter-file" ]]; then
            overrides+=("includeBalancedModel=$INCLUDE_BALANCED_MODEL")
          fi

          if [[ "$INCLUDE_SPEECH_MODEL" != "from-parameter-file" ]]; then
            overrides+=("includeSpeechModel=$INCLUDE_SPEECH_MODEL")
          fi

          {
            echo "AZURE_SUBSCRIPTION_ID=$subscription_id"
            echo "AZURE_RESOURCE_GROUP=$resource_group"
            echo "FOUNDRY_PARAMETER_FILE=$parameter_file"
            echo "FOUNDRY_PARAMETER_OVERRIDES=${overrides[*]-}"
          } >> "$GITHUB_ENV"

      - name: Azure login
        uses: Azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Build Bicep template
        run: az bicep build --file infra/foundry/main.bicep

      - name: Validate deployment
        shell: bash
        run: |
          set -euo pipefail

          az deployment group validate \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/foundry/main.bicep \
            --parameters "$FOUNDRY_PARAMETER_FILE" $FOUNDRY_PARAMETER_OVERRIDES

      - name: Preview deployment
        if: inputs.mode == 'what-if' || inputs.mode == 'deploy'
        shell: bash
        run: |
          set -euo pipefail

          az deployment group what-if \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/foundry/main.bicep \
            --parameters "$FOUNDRY_PARAMETER_FILE" $FOUNDRY_PARAMETER_OVERRIDES

      - name: Deploy Foundry resources
        if: inputs.mode == 'deploy'
        shell: bash
        run: |
          set -euo pipefail

          az deployment group create \
            --name "backlog-foundry-${{ github.run_number }}" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/foundry/main.bicep \
            --parameters "$FOUNDRY_PARAMETER_FILE" $FOUNDRY_PARAMETER_OVERRIDES

      - name: Write deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Foundry deployment"
            echo ""
            echo "- Mode: \`${{ inputs.mode }}\`"
            echo "- Environment: \`${{ inputs.environment_name }}\`"
            echo "- Subscription: \`${AZURE_SUBSCRIPTION_ID:-unresolved}\`"
            echo "- Resource group: \`${AZURE_RESOURCE_GROUP:-unresolved}\`"
            echo "- Parameter file: \`${FOUNDRY_PARAMETER_FILE:-unresolved}\`"
            echo "- Parameter overrides: \`${FOUNDRY_PARAMETER_OVERRIDES:-none}\`"
          } >> "$GITHUB_STEP_SUMMARY"
