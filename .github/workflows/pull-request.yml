name: Pull request

on:
  # A draft builds like any pull request, so marking it ready does not build it
  # again: the required checks on its head commit already count.
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.ref }}
  cancel-in-progress: true

# The solution splits along one line: the two MAUI app heads need a platform
# workload, and nothing else in the repository does. Measured on a four-core
# machine, a full rebuild is ~63s for the Android head and ~10s for the Windows
# one against ~6s for the other fifty-one projects, and `dotnet workload restore`
# cost 154s of the run before this split. No test project references either head
# -- they are the outermost layer -- so the heads no longer sit in front of the
# suite. They build in their own job, beside it.
#
# A pull request that changes only .devbook/ chapters builds nothing here: the
# devbook-meta and devbook-metadata workflows check those, and the .NET tests that
# read .devbook/ catch up on the next pull request that touches code. The skip is
# a job-level `if`, not a `paths-ignore` on the workflow, because these jobs are
# required checks: a skipped job reports success to the ruleset, and so to
# auto-merge, while a workflow that never starts leaves them Expected forever.
jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      # 'false' only when every changed file is under .devbook/. A manual run, an
      # empty file list, or anything else answers 'true'.
      - name: List the changed files
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files?per_page=100" --jq '.[].filename')
          outside=$(printf '%s\n' "$files" | grep -v '^\.devbook/' | grep -c . || true)
          if [ -n "$files" ] && [ "$outside" -eq 0 ]; then
            echo "Only .devbook/ changed; the build jobs are skipped."
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  # Each build job runs unless detection answered 'false', so a failed or
  # cancelled detection still builds rather than skipping into a green check.
  dotnet:
    name: Build and test .NET
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # DevbookBuilderParityTests runs tools/devbook/build-database.mjs to hold
      # the app's C# builder to it (local ADR 0015), and the writer needs
      # node:sqlite, which is Node 22.5 or later. Pinned rather than left to
      # whatever the runner image ships, so the comparison cannot silently stop
      # running when the image changes.
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'

      # Backlog.WithoutAppHeads.slnf is the solution minus the two heads, and it
      # is a hand-held list: a test project added to the solution but not to the
      # filter would never run here, and the job would still be green. That
      # failure mode -- a run that tested nothing and said so in no way -- has
      # bitten this pipeline before, so every project is accounted for before
      # anything is built.
      - name: Check the solution filter accounts for every project
        shell: pwsh
        run: |
          $heads = @(
            'src\App\Backlog.Desktop\Backlog.Desktop.csproj',
            'src\App\Backlog.Mobile\Backlog.Mobile.csproj'
          )
          $solution = (Select-String -Path Backlog.sln -Pattern '"([^"]+\.csproj)"' -AllMatches).Matches |
            ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique
          $filter = (Get-Content Backlog.WithoutAppHeads.slnf -Raw | ConvertFrom-Json).solution.projects

          $unfiltered = @($solution | Where-Object { $_ -notin $filter } | Sort-Object)
          $stale = @($filter | Where-Object { $_ -notin $solution } | Sort-Object)

          if (Compare-Object $unfiltered @($heads | Sort-Object)) {
            Write-Host 'In the solution but not in Backlog.WithoutAppHeads.slnf:'
            $unfiltered | ForEach-Object { Write-Host "  $_" }
            throw 'The filter must list every solution project except the app heads. Add the project to Backlog.WithoutAppHeads.slnf, or -- if it is a new app head -- to the app-heads job and to the list above.'
          }

          if ($stale) {
            Write-Host 'Listed in Backlog.WithoutAppHeads.slnf but no longer in Backlog.sln:'
            $stale | ForEach-Object { Write-Host "  $_" }
            throw 'Remove the stale entries from Backlog.WithoutAppHeads.slnf.'
          }

          Write-Host "$($filter.Count) projects filtered, $($heads.Count) app heads built by the app-heads job."

      # No RuntimeIdentifierOverride / WindowsPackageType / Appx properties here:
      # those exist for the heads, which this job does not build.
      - name: Restore dependencies
        run: dotnet restore Backlog.WithoutAppHeads.slnf

      # The solution builds at zero warnings (the rule severities are in the
      # root .editorconfig), and this is where a new one stops. It is passed
      # here rather than set in Directory.Build.props so a half-finished local
      # edit still builds; both app-head builds below pass it too.
      - name: Build
        run: >
          dotnet build Backlog.WithoutAppHeads.slnf
          --no-restore
          --configuration Release
          -p:TreatWarningsAsErrors=true

      # xunit v3 runs on Microsoft.Testing.Platform, which global.json opts
      # `dotnet test` into. The solution filter is named with --solution, and the
      # four options below are what .github/_ci.runsettings and the VSTest loggers
      # used to say before MTP replaced both:
      #
      #   MaxCpuCount 1                -> --max-parallel-test-modules 1
      #   ParallelizeTestCollections   -> --parallel none
      #   --logger trx                 -> --report-trx (the reporter is an opt-in
      #                                   extension under MTP, which is why every
      #                                   test project references TrxReport)
      #   --results-directory          -> unchanged, and it is what the upload
      #                                   steps below collect.
      #
      # --coverage and --coverage-output-format cobertura are new rather than
      # mapped: coverlet's collector was a VSTest data collector MTP never loaded.
      # They come from Microsoft.Testing.Extensions.CodeCoverage, an opt-in
      # extension every test project references for the same reason as TrxReport.
      # Each module writes its own <guid>.cobertura.xml at the top of TestResults.
      #
      # MTP swallows an option it does not recognise and then runs nothing, exiting
      # 5 with "Zero tests ran" rather than rejecting the argument -- so a stale
      # flag here reads as a green-looking run of no tests. Change these only
      # against `dotnet test --help`.
      - name: Run tests
        run: >
          dotnet test
          --solution Backlog.WithoutAppHeads.slnf
          --no-build
          --configuration Release
          --max-parallel-test-modules 1
          --results-directory TestResults
          --report-trx
          --parallel none
          --coverage
          --coverage-output-format cobertura

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dotnet-test-results
          # The coverage reports go in their own artifact below; MTP also copies
          # each one beside its TRX under In/, which would upload them twice.
          path: |
            TestResults
            !TestResults/**/*.cobertura.xml
          if-no-files-found: ignore

      # One report per test module, at the top of TestResults only: the copies
      # under In/ are the TRX attachments of the same files.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dotnet-coverage
          path: TestResults/*.cobertura.xml
          if-no-files-found: ignore

      # Each module reports every product assembly it loaded, so one assembly
      # appears in several reports. A line counts once, covered when any module
      # hit it; summing the reports' own line-rate figures would count it again
      # per module. The figure lands on the run's summary page.
      - name: Summarise coverage
        if: always()
        shell: pwsh
        run: |
          $reports = @(Get-ChildItem TestResults -Filter *.cobertura.xml -File -ErrorAction SilentlyContinue)
          if ($reports.Count -eq 0) {
            "## Coverage`n`nNo coverage report was written." >> $env:GITHUB_STEP_SUMMARY
            return
          }

          $valid = @{}
          $covered = @{}
          foreach ($report in $reports) {
            $xml = [xml](Get-Content $report.FullName -Raw)
            foreach ($package in $xml.SelectNodes('/coverage/packages/package')) {
              $name = $package.GetAttribute('name')
              if (-not $valid.ContainsKey($name)) {
                $valid[$name] = [System.Collections.Generic.HashSet[string]]::new()
                $covered[$name] = [System.Collections.Generic.HashSet[string]]::new()
              }
              foreach ($class in $package.SelectNodes('classes/class')) {
                $file = $class.GetAttribute('filename')
                foreach ($line in $class.SelectNodes('lines/line')) {
                  $key = "$file|$($line.GetAttribute('number'))"
                  [void]$valid[$name].Add($key)
                  if ([long]$line.GetAttribute('hits') -gt 0) { [void]$covered[$name].Add($key) }
                }
              }
            }
          }

          $invariant = [System.Globalization.CultureInfo]::InvariantCulture
          $percent = { param($c, $v) if ($v -eq 0) { 'n/a' } else { [string]::Format($invariant, '{0:N1}%', 100.0 * $c / $v) } }
          $rows = foreach ($name in $valid.Keys | Sort-Object) {
            [pscustomobject]@{ Name = $name; Covered = $covered[$name].Count; Valid = $valid[$name].Count }
          }
          $totalCovered = [long]($rows | Measure-Object Covered -Sum).Sum
          $totalValid = [long]($rows | Measure-Object Valid -Sum).Sum

          $summary = @(
            '## Coverage'
            ''
            "**Line coverage: $(& $percent $totalCovered $totalValid)** ($totalCovered of $totalValid lines, merged across $($reports.Count) test modules)"
            ''
            '| Assembly | Line coverage | Lines |'
            '| --- | ---: | ---: |'
          )
          $summary += $rows | ForEach-Object { "| $($_.Name) | $(& $percent $_.Covered $_.Valid) | $($_.Covered) / $($_.Valid) |" }
          $summary -join "`n" >> $env:GITHUB_STEP_SUMMARY

  app-heads:
    name: Build the app heads
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Scoped to the heads rather than to the solution: they are the only
      # projects with a platform target framework, and so the only reason any
      # job here pays for a workload install.
      - name: Restore .NET workloads
        shell: pwsh
        run: |
          dotnet workload restore src\App\Backlog.Desktop\Backlog.Desktop.csproj
          dotnet workload restore src\App\Backlog.Mobile\Backlog.Mobile.csproj

      - name: Restore dependencies
        shell: pwsh
        run: |
          dotnet restore src\App\Backlog.Desktop\Backlog.Desktop.csproj `
            -p:RuntimeIdentifierOverride=win-x64 `
            -p:WindowsPackageType=None `
            -p:AppxPackageSigningEnabled=false `
            -p:GenerateAppxPackageOnBuild=false
          dotnet restore src\App\Backlog.Mobile\Backlog.Mobile.csproj `
            -p:RuntimeIdentifierOverride=win-x64 `
            -p:WindowsPackageType=None `
            -p:AppxPackageSigningEnabled=false `
            -p:GenerateAppxPackageOnBuild=false

      - name: Restore desktop runtime dependencies
        run: >
          dotnet restore src\App\Backlog.Desktop\Backlog.Desktop.csproj
          -r win-x64
          -p:WindowsPackageType=None
          -p:AppxPackageSigningEnabled=false
          -p:GenerateAppxPackageOnBuild=false

      - name: Build the Windows head
        run: >
          dotnet build src\App\Backlog.Desktop\Backlog.Desktop.csproj
          --no-restore
          --configuration Release
          -p:TreatWarningsAsErrors=true
          -p:RuntimeIdentifierOverride=win-x64
          -p:WindowsPackageType=None
          -p:AppxPackageSigningEnabled=false
          -p:GenerateAppxPackageOnBuild=false

      - name: Build the Android head
        run: >
          dotnet build src\App\Backlog.Mobile\Backlog.Mobile.csproj
          --no-restore
          --configuration Release
          -p:TreatWarningsAsErrors=true
          -p:RuntimeIdentifierOverride=win-x64
          -p:WindowsPackageType=None
          -p:AppxPackageSigningEnabled=false
          -p:GenerateAppxPackageOnBuild=false

  vscode-extension:
    name: Compile VS Code extension
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: src/App/Backlog.Ide.VsCode/package-lock.json

      - name: Restore dependencies
        working-directory: src/App/Backlog.Ide.VsCode
        run: npm ci

      - name: Compile
        working-directory: src/App/Backlog.Ide.VsCode
        run: npm run compile
