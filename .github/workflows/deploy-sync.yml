name: Deploy Sync

# Provisions and deploys the cloud sync tier (local ADR 0005) from infra/sync/
# with the Azure Developer CLI.
#
# Unlike Deploy Foundry, this workflow runs on a GitHub-hosted runner and
# authenticates with an OIDC federated credential: there is no publish profile
# and no service principal secret. The one secret it does carry belongs to the
# service rather than to Azure — SYNC_TOKEN_SIGNING_KEY, the key the sync service
# signs device tokens with. The federated credential, the resource group and that
# secret are created by hand once — see docs/deployment/sync.md.

# No trigger of its own: a person starts every infrastructure run, here or
# through Deploy All. The service, though, deploys unattended: every Release All
# run that publishes a release calls this workflow in `service` mode, nightly
# included, so the running service reports the release number the apps carry
# (GET /'s `release`; its `version` is the compatibility number, untouched). That
# mode deploys the container and provisions nothing; infrastructure stays a
# deliberate run. The push-to-main trigger this workflow used to carry stays
# parked.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to run'
        required: true
        default: preview
        type: choice
        options:
          - preview
          - provision
          - deploy
          # The service alone: no preview, no provision. Run by hand it deploys a
          # service with no release (`release: null` on GET /), visibly not one.
          - service
      environment_name:
        description: 'GitHub environment; also names the azd environment'
        required: true
        default: backlog-sync
        type: string

  # Called by Deploy All (infrastructure) and Release All (`service`). `mode` is a
  # string here because workflow_call has no choice type; the values it accepts
  # are the same four.
  workflow_call:
    inputs:
      mode:
        required: false
        default: preview
        type: string
      environment_name:
        required: false
        default: backlog-sync
        type: string
      # The release number the service reports as `release` on GET /,
      # MAJOR.MINOR.PATCH; blank deploys no release. Release All passes the number
      # it publishes. Not the service's `version`: that is the compatibility number
      # every client stops syncing above (docs/deployment/sync.md), and only the
      # project's <Version> moves it.
      release:
        required: false
        default: ''
        type: string
      # The release tag the number belongs to, vX.Y.Z. When the tag already exists,
      # the service is deployed only from the commit it points at.
      release_tag:
        required: false
        default: ''
        type: string
    # An environment secret cannot be passed by name from a caller, because the
    # caller's job has no environment: it is resolved here, by the job that
    # declares one, which is why Deploy All passes `secrets: inherit` to this
    # workflow. Declared so the contract is visible from the call site.
    secrets:
      SYNC_TOKEN_SIGNING_KEY:
        description: 'HMAC key the sync service signs device tokens with; base64, at least 32 bytes'
        required: true
    outputs:
      endpoint:
        description: 'Deployed sync service endpoint, empty when the run only previewed'
        value: ${{ jobs.sync.outputs.endpoint }}

permissions:
  contents: read

concurrency:
  group: deploy-sync-${{ inputs.environment_name || 'backlog-sync' }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  sync:
    name: Provision and deploy Sync
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment_name || 'backlog-sync' }}
    permissions:
      contents: read
      # Required for the OIDC federated credential. This is the whole reason no
      # secret is stored: the runner mints a short-lived token Azure trusts.
      id-token: write

    outputs:
      endpoint: ${{ steps.summary.outputs.endpoint }}

    env:
      # Both triggers supply a mode and default it to preview, so a run that
      # says nothing changes nothing.
      DEPLOY_MODE: ${{ inputs.mode }}
      # Through env, never spliced into a script; Verify checks its shape.
      RELEASE_NUMBER: ${{ inputs.release }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      AZURE_ENV_NAME: ${{ inputs.environment_name || 'backlog-sync' }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      # SYNC_TOKEN_SIGNING_KEY is deliberately not here: it is set on the steps
      # that read it (Verify, Preview, Provision, Load, Deploy), so the third-party
      # actions and the other steps never run with it in their environment.

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify deployment target
        env:
          # The one secret this workflow carries, and it is the service's, not
          # Azure's: the HMAC key the sync service signs device tokens with. It is
          # set on this step and on the three azd steps below, and on no other,
          # because azd substitutes ${SYNC_TOKEN_SIGNING_KEY} in
          # infra/sync/main.parameters.json from the process environment; it never
          # goes through `azd env set`, so it is not written to the azd environment
          # and does not surface in `azd env get-values`. GitHub masks it in the
          # log; nothing below prints it anyway.
          SYNC_TOKEN_SIGNING_KEY: ${{ secrets.SYNC_TOKEN_SIGNING_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          # An unknown mode would fall through every step's `if:` and report a
          # green run that changed nothing.
          if ($env:DEPLOY_MODE -notin @('preview', 'provision', 'deploy', 'service')) {
            Write-Output "::error::Unknown mode '$env:DEPLOY_MODE'. Use preview, provision, deploy or service."
            exit 1
          }

          if ($env:RELEASE_NUMBER -and $env:RELEASE_NUMBER -notmatch '^\d+\.\d+\.\d+$') {
            Write-Output "::error::release must be MAJOR.MINOR.PATCH (got '$env:RELEASE_NUMBER')."
            exit 1
          }
          if ($env:RELEASE_NUMBER -and $env:DEPLOY_MODE -notin @('deploy', 'service')) {
            Write-Output "::error::release is set but mode '$env:DEPLOY_MODE' deploys no service."
            exit 1
          }

          # Fail before touching Azure, with the name of the variable that is
          # missing, rather than letting azd fail on a half-configured environment.
          $required = @{
            AZURE_CLIENT_ID       = $env:AZURE_CLIENT_ID
            AZURE_TENANT_ID       = $env:AZURE_TENANT_ID
            AZURE_SUBSCRIPTION_ID = $env:AZURE_SUBSCRIPTION_ID
            AZURE_RESOURCE_GROUP  = $env:AZURE_RESOURCE_GROUP
            AZURE_LOCATION        = $env:AZURE_LOCATION
          }

          $missing = $required.GetEnumerator() | Where-Object { -not $_.Value } | ForEach-Object { $_.Key }
          if ($missing) {
            Write-Output "::error::Set these variables on the GitHub environment '$env:AZURE_ENV_NAME': $($missing -join ', '). See docs/deployment/sync.md."
            exit 1
          }

          if ($env:AZURE_SUBSCRIPTION_ID -notmatch '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$') {
            Write-Output "::error::AZURE_SUBSCRIPTION_ID must be a GUID."
            exit 1
          }

          if ($env:AZURE_RESOURCE_GROUP -notmatch '^[A-Za-z0-9._()-]{1,90}$') {
            Write-Output "::error::AZURE_RESOURCE_GROUP contains characters Azure does not allow in a resource group name."
            exit 1
          }

          # The signing key is checked to the same rule the service enforces on
          # start (base64, at least 32 bytes decoded), so a bad key fails here
          # with its name rather than as a container app that never comes up.
          # Only its shape is ever reported; the value stays out of the log.
          if (-not $env:SYNC_TOKEN_SIGNING_KEY) {
            Write-Output "::error::Set the secret SYNC_TOKEN_SIGNING_KEY on the GitHub environment '$env:AZURE_ENV_NAME': the sync service signs device tokens with it and refuses to start without one. See docs/deployment/sync.md."
            exit 1
          }

          try {
            $keyBytes = [Convert]::FromBase64String($env:SYNC_TOKEN_SIGNING_KEY)
          }
          catch {
            Write-Output "::error::SYNC_TOKEN_SIGNING_KEY is not valid base64. Mint one as docs/deployment/sync.md describes."
            exit 1
          }

          if ($keyBytes.Length -lt 32) {
            Write-Output "::error::SYNC_TOKEN_SIGNING_KEY decodes to $($keyBytes.Length) bytes; the sync service requires at least 32. Mint one as docs/deployment/sync.md describes."
            exit 1
          }

      # Numbers come from the tags, so two Release All runs can plan the same one. A
      # re-run of an older failed run re-runs this job, but reuses every job of its
      # own that passed, its plan included: without this check it would put older
      # service code into production under a number a newer run already published.
      # Checked here, inside the job a re-run always repeats, and before Azure is
      # touched. The publish job keeps its own check for the packages.
      - name: Check the release tag
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            Write-Output "::error::release_tag must be vMAJOR.MINOR.PATCH (got '$env:RELEASE_TAG')."
            exit 1
          }

          $tagCommit = (gh api "repos/$env:GH_REPO/commits/refs/tags/$env:RELEASE_TAG" --jq .sha 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -eq 0) {
            if ($tagCommit -ne $env:GITHUB_SHA) {
              Write-Output "::error::$env:RELEASE_TAG already exists at $tagCommit, not at this run's commit $env:GITHUB_SHA. A newer run has released this number; deploying here would put older service code into production under it."
              exit 1
            }
            Write-Output "$env:RELEASE_TAG exists at this run's commit: a re-run of the same release."
          }
          elseif ($tagCommit -match 'No commit found') {
            Write-Output "$env:RELEASE_TAG is not published yet."
          }
          else {
            Write-Output "::error::Could not resolve the commit of $env:RELEASE_TAG ($tagCommit)."
            exit 1
          }

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Set up azd
        uses: Azure/setup-azd@0b7e3a35ab00f2eee7080c845eb39c3f0ebfa553 # v2.4.0

      - name: Sign in to Azure
        run: |
          $ErrorActionPreference = 'Stop'

          azd auth login `
            --client-id $env:AZURE_CLIENT_ID `
            --tenant-id $env:AZURE_TENANT_ID `
            --federated-credential-provider github
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error::Federated sign-in failed. Confirm the app registration has a federated credential for this repository and ref, and that AZURE_CLIENT_ID/AZURE_TENANT_ID are correct."
            exit 1
          }

      - name: Select azd environment
        run: |
          $ErrorActionPreference = 'Stop'

          # The runner is fresh every run, so the environment is recreated rather
          # than restored. Everything it needs comes from the GitHub environment
          # variables above; nothing is carried between runs.
          azd env new $env:AZURE_ENV_NAME `
            --subscription $env:AZURE_SUBSCRIPTION_ID `
            --location $env:AZURE_LOCATION `
            --no-prompt
          if ($LASTEXITCODE -ne 0) { exit 1 }

          # infra/sync/main.bicep is resource-group scoped, so azd deploys into an
          # existing group instead of creating one.
          azd env set AZURE_RESOURCE_GROUP $env:AZURE_RESOURCE_GROUP
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # infra/sync/main.parameters.json passes containerImage from
      # SERVICE_SYNC_IMAGE_NAME, and the template falls back to a public placeholder
      # when it is empty. On a fresh runner it always is, so without this every
      # provision would swap the running service for the placeholder until the next
      # service deploy. The running app's image is read back and handed to the
      # template instead; only a first provision, with no app yet, keeps the
      # placeholder. azd's own sign-in has no command that reads a resource, so the
      # Azure CLI signs in with the same federated credential.
      - name: Keep the running service image
        if: env.DEPLOY_MODE != 'service'
        run: |
          $ErrorActionPreference = 'Stop'

          $request = "$($env:ACTIONS_ID_TOKEN_REQUEST_URL)&audience=api://AzureADTokenExchange"
          $oidc = Invoke-RestMethod -Uri $request -Headers @{ Authorization = "Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN" }
          az login --service-principal `
            --username $env:AZURE_CLIENT_ID `
            --tenant $env:AZURE_TENANT_ID `
            --federated-token $oidc.value `
            --allow-no-subscriptions `
            --output none
          if ($LASTEXITCODE -ne 0) { throw "The Azure CLI could not sign in with the federated credential." }
          az account set --subscription $env:AZURE_SUBSCRIPTION_ID
          if ($LASTEXITCODE -ne 0) { throw "Could not select subscription $env:AZURE_SUBSCRIPTION_ID." }

          # The app azd matches to the `sync` service, in this azd environment.
          $apps = az resource list `
            --resource-group $env:AZURE_RESOURCE_GROUP `
            --resource-type 'Microsoft.App/containerApps' `
            --output json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Could not list the container apps in $env:AZURE_RESOURCE_GROUP." }
          $sync = @($apps | Where-Object {
              $_.tags.'azd-service-name' -eq 'sync' -and $_.tags.'azd-env-name' -eq $env:AZURE_ENV_NAME
            })

          if ($sync.Count -gt 1) {
            throw "Found $($sync.Count) container apps tagged as the sync service of '$env:AZURE_ENV_NAME' in $env:AZURE_RESOURCE_GROUP; expected one."
          }

          if ($sync.Count -eq 0) {
            $kept = 'none - no sync app exists yet, so this first provision runs the placeholder image'
          }
          else {
            $app = az resource show --ids $sync[0].id --output json | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw "Could not read the container app $($sync[0].name)." }
            $image = "$($app.properties.template.containers[0].image)".Trim()
            if (-not $image) { throw "The container app $($sync[0].name) reports no image." }

            azd env set SERVICE_SYNC_IMAGE_NAME $image
            if ($LASTEXITCODE -ne 0) { exit 1 }
            $kept = $image
          }

          "### Sync service image" >> $env:GITHUB_STEP_SUMMARY
          "Kept for this run's provision: ``$kept``." >> $env:GITHUB_STEP_SUMMARY
          Write-Output "Service image kept for the provision: $kept"

      # Every infrastructure mode previews first; `service` touches no infrastructure.
      - name: Preview infrastructure changes
        if: env.DEPLOY_MODE != 'service'
        env:
          # Read from the process environment by azd; see Verify deployment target.
          SYNC_TOKEN_SIGNING_KEY: ${{ secrets.SYNC_TOKEN_SIGNING_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          azd provision --preview --no-prompt
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Provision infrastructure
        if: env.DEPLOY_MODE == 'provision' || env.DEPLOY_MODE == 'deploy'
        env:
          # Read from the process environment by azd; see Verify deployment target.
          SYNC_TOKEN_SIGNING_KEY: ${{ secrets.SYNC_TOKEN_SIGNING_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          azd provision --no-prompt
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # Without a provision in this run the fresh azd environment knows none of the
      # template's outputs (the registry azd pushes to, SYNC_SERVICE_URI). They are
      # read back from the last provision of this resource group instead.
      - name: Load the provisioned environment
        if: env.DEPLOY_MODE == 'service'
        env:
          # Read from the process environment by azd; see Verify deployment target.
          SYNC_TOKEN_SIGNING_KEY: ${{ secrets.SYNC_TOKEN_SIGNING_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          azd env refresh --no-prompt
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error::Could not read the provisioned environment back. Provision it first: Deploy Sync, mode provision."
            exit 1
          }

      - name: Deploy the sync service
        if: env.DEPLOY_MODE == 'deploy' || env.DEPLOY_MODE == 'service'
        env:
          # Read from the process environment by azd; see Verify deployment target.
          SYNC_TOKEN_SIGNING_KEY: ${{ secrets.SYNC_TOKEN_SIGNING_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          # azd builds the image with `dotnet publish /t:PublishContainer` in its own
          # process environment, and MSBuild reads environment variables as
          # properties: BacklogRelease here becomes the assembly metadata GET /
          # reports as `release`. Version is left alone - it is the compatibility
          # number clients stop syncing above. Set on this step alone, so no other
          # build in the job is stamped.
          if ($env:RELEASE_NUMBER) {
            $env:BacklogRelease = $env:RELEASE_NUMBER
            Write-Output "Deploying the sync service as release $env:RELEASE_NUMBER."
          }

          azd deploy sync --no-prompt
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # The proof that the number reached the running service, and that the revision
      # serving is this run's: Release All publishes only after this passes.
      - name: Check the deployed release
        if: env.RELEASE_NUMBER != ''
        run: |
          $ErrorActionPreference = 'Stop'

          $values = azd env get-values --output json | ConvertFrom-Json
          $endpoint = "$($values.SYNC_SERVICE_URI)".TrimEnd('/')
          if (-not $endpoint) { throw "SYNC_SERVICE_URI is not in the azd environment; cannot check the deployed release." }

          # The new revision takes a moment to serve, and the app scales from zero.
          $deadline = (Get-Date).AddMinutes(10)
          $last = 'no answer'
          while ((Get-Date) -lt $deadline) {
            try {
              $identity = Invoke-RestMethod -Uri "$endpoint/" -TimeoutSec 30
              if ($identity.release -eq $env:RELEASE_NUMBER -and $identity.commit -eq $env:GITHUB_SHA) {
                "### Sync service" >> $env:GITHUB_STEP_SUMMARY
                "$endpoint/ reports release ``$($identity.release)`` at commit ``$($identity.commit)``, compatibility version ``$($identity.version)``." >> $env:GITHUB_STEP_SUMMARY
                Write-Output "The sync service reports release $($identity.release) at $($identity.commit), version $($identity.version)."
                return
              }
              $last = "release '$($identity.release)', commit '$($identity.commit)', version '$($identity.version)'"
            }
            catch {
              $last = $_.Exception.Message
            }
            Start-Sleep -Seconds 15
          }

          throw "The sync service at $endpoint/ never reported release $env:RELEASE_NUMBER at commit $env:GITHUB_SHA; last answer: $last."

      - name: Write deployment summary
        id: summary
        if: always()
        run: |
          $ErrorActionPreference = 'Continue'

          $endpoint = 'not resolved'
          $values = azd env get-values --output json 2>$null | ConvertFrom-Json
          if ($values -and $values.SYNC_SERVICE_URI) { $endpoint = $values.SYNC_SERVICE_URI }

          # Empty rather than 'not resolved' on the output, so a caller can test it.
          "endpoint=$(if ($endpoint -eq 'not resolved') { '' } else { $endpoint })" |
            Add-Content -LiteralPath $env:GITHUB_OUTPUT

          @(
            "### Sync deployment"
            ""
            "- Mode: ``$env:DEPLOY_MODE``"
            "- Release: ``$(if ($env:RELEASE_NUMBER) { $env:RELEASE_NUMBER } else { 'none' })``"
            "- Environment: ``$env:AZURE_ENV_NAME``"
            "- Subscription: ``$env:AZURE_SUBSCRIPTION_ID``"
            "- Resource group: ``$env:AZURE_RESOURCE_GROUP``"
            "- Region: ``$env:AZURE_LOCATION``"
            "- Service endpoint: ``$endpoint``"
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
