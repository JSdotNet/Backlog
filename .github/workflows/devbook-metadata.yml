name: Devbook metadata blocks

# The metadata half of the devbook gate, and repo-native on purpose.
#
# `devbook-meta.yml`, the installed workflow beside this file, runs
# `build.mjs --check`, which resolves references and nothing else. The
# `validateDocument` export that knows each folder's `status` ladder, its `type`
# vocabulary and its allowed fields had no caller at all, so a chapter carrying
# `status: idea` passed every run (issue #241).
#
# `tools/devbook/check-metadata.mjs` is that caller, written beside the
# repository's own tooling rather than inside the installed copy, and this
# workflow is where it blocks a pull request. Upstream runs the same validation
# from the knowledge-graph canvas and the `devbook-check` skill rather
# than from `--check`, so this is a third consumer of an exported seam, not a
# fork of the tool.
#
# A broken reference fails in `devbook-meta.yml`. This job is the other hard
# failure, and it touches no generated file.

on:
  push:
    branches:
      - main
    paths:
      - '.devbook/arc42/**'
      - '.devbook/domain/**'
      - '.devbook/tech/**'
      - '.devbook/design/**'
      - '.devbook/ai/**'
      - '.devbook/_tools/devbook-meta/**'
      - 'tools/devbook/**'
      - '.github/workflows/devbook-metadata.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.devbook/arc42/**'
      - '.devbook/domain/**'
      - '.devbook/tech/**'
      - '.devbook/design/**'
      - '.devbook/ai/**'
      - '.devbook/_tools/devbook-meta/**'
      - 'tools/devbook/**'
      - '.github/workflows/devbook-metadata.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devbook-metadata-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Validate metadata blocks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'

      # The gate. Fails on a status outside the folder's ladder, an unknown
      # `type`, a field the schema does not list, and every other error the
      # installed `validateDocument` reports.
      - name: Check metadata blocks
        run: node tools/devbook/check-metadata.mjs

      # The check's own tests: it blocks for exactly one reason at a time, and
      # it is red on a root it finds nothing to check in.
      - name: Test the check
        run: node --test tools/devbook/check-metadata.test.mjs

  database:
    name: Build the devbook database
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The same Node the pull request workflow pins, rather than whatever the
      # runner image ships: build-database.mjs needs node:sqlite (Node 22.5+).
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'

      - name: Test the writer
        run: node --test "tools/devbook/*.test.mjs"

      # This step blocks, and that is the point rather than an oversight.
      #
      # The predecessor's drift check had to be softened to a warning
      # because its output was committed: making every pull request carry a
      # regenerated index is what turned `_meta/*.json` into merge conflicts.
      # The database is a build output that nothing commits, so there is no
      # second copy for a branch to disagree with and nothing for a failure here
      # to be about except the build actually being broken. Local ADR 0004 buys
      # exactly this back — a derived artifact that CI may enforce again.
      # `--check` builds into the temp folder and deletes it: since local ADR 0015
      # the script writes nothing into a repository, and the app builds the
      # database it reads for itself.
      - name: Build it on the real corpus
        run: node tools/devbook/build-database.mjs --check
