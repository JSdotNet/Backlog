name: Release desktop

on:
  push:
    tags:
      - 'v*'
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without the leading v (e.g. 1.2.3)'
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign, and publish the MSIX
    runs-on: windows-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Check scheduled release changes
        id: release_gate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ github.event_name }}' -ne 'schedule') {
            "should_release=true" >> $env:GITHUB_OUTPUT
            Write-Output "Release requested by ${{ github.event_name }}."
            return
          }

          $latestTag = gh release list --limit 1 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[0].tagName'
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect existing GitHub releases." }

          if ([string]::IsNullOrWhiteSpace($latestTag) -or $latestTag -eq 'null') {
            "should_release=true" >> $env:GITHUB_OUTPUT
            Write-Output "No existing release found; scheduled release will run."
            return
          }

          # A git pathspec matches a directory and everything under it, but only on a
          # path-segment boundary: 'src/Modules/Tasks/Backlog.Modules.Tasks' does not
          # match the sibling '...Backlog.Modules.Tasks.UI'. So every project the desktop
          # head composes has to be named. That list was hand-maintained and went stale --
          # it never grew the Dashboard, Roadmap or Sessions modules -- so it is derived
          # from the head's ProjectReference graph now. Only what is not a referenced
          # project is still written out here.
          $releasePaths = & ./build/Get-ReleasePaths.ps1 `
            -HeadProject 'src/App/Backlog.Desktop/Backlog.Desktop.csproj' `
            -Extra @(
              'Backlog.sln',
              'build/Backlog.Desktop.appinstaller.template',
              'build/New-AppInstaller.ps1',
              'build/Get-ReleasePaths.ps1',
              '.github/workflows/release-desktop.yml'
            )
          Write-Output "Desktop release gate watches $($releasePaths.Count) paths."
          if (-not $releasePaths) {
            throw "The release path list came back empty. Refusing to continue: 'git diff -- ' with no pathspec matches every file, so the gate would report changes unconditionally."
          }
          $changedFiles = git diff --name-only "$latestTag..HEAD" -- $releasePaths
          if ($LASTEXITCODE -ne 0) { throw "Could not compare HEAD with latest release $latestTag." }

          if ($changedFiles) {
            "should_release=true" >> $env:GITHUB_OUTPUT
            Write-Output "Scheduled release will run because release-relevant files changed since $latestTag."
            return
          }

          "should_release=false" >> $env:GITHUB_OUTPUT
          "### Desktop release skipped" >> $env:GITHUB_STEP_SUMMARY
          "No release-relevant changes were found since $latestTag." >> $env:GITHUB_STEP_SUMMARY
      - name: Install MAUI Windows workload
        if: steps.release_gate.outputs.should_release == 'true'
        run: dotnet workload install maui-windows

      - name: Derive version numbers
        if: steps.release_gate.outputs.should_release == 'true'
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $raw = '${{ github.event.inputs.version }}'
            $tag = "v$raw"
          }
          else {
            $tag = '${{ github.ref_name }}'
            $raw = $tag.TrimStart('v')
            if ('${{ github.ref_type }}' -eq 'branch') {
              if ('${{ github.ref_name }}' -ne 'main') {
                throw "Unsupported release branch '${{ github.ref_name }}'."
              }
              $raw = '0.1.${{ github.run_number }}'
              $tag = "v$raw"
            }
          }
          if ($raw -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version must be MAJOR.MINOR.PATCH or a v-prefixed tag (got '$raw')."
          }
          $four = "$raw.0"
          "tag=$tag"                >> $env:GITHUB_OUTPUT
          "display=$raw"            >> $env:GITHUB_OUTPUT
          "package=$four"           >> $env:GITHUB_OUTPUT
          "msix=Backlog.Desktop_${four}_x64.msix" >> $env:GITHUB_OUTPUT
          Write-Output "Tag=$tag Display=$raw Package=$four"

      - name: Check signing configuration
        if: steps.release_gate.outputs.should_release == 'true'
        id: signing
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)

          if ($hasCertificate -and $hasPassword) {
            "configured=true" >> $env:GITHUB_OUTPUT
            Write-Output "Signing certificate secrets are configured."
            return
          }

          "configured=false" >> $env:GITHUB_OUTPUT
          if ('${{ github.event_name }}' -ne 'workflow_dispatch' -and '${{ github.ref_type }}' -eq 'branch') {
            "### Desktop release skipped" >> $env:GITHUB_STEP_SUMMARY
            "Signing secrets are not configured, so the main-branch release package was not produced." >> $env:GITHUB_STEP_SUMMARY
            Write-Output "Signing certificate secrets are not configured. Skipping main-branch release packaging."
            return
          }

          if (-not $hasCertificate) {
            throw "Secret WINDOWS_CERTIFICATE_BASE64 is not set. Refusing to produce an unsigned package."
          }
          throw "Secret WINDOWS_CERTIFICATE_PASSWORD is not set."

      - name: Import code-signing certificate
        if: steps.release_gate.outputs.should_release == 'true' && steps.signing.outputs.configured == 'true'
        id: cert
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_SUBJECT: ${{ vars.WINDOWS_CERTIFICATE_SUBJECT || 'CN=Backlog Desktop Test Signing' }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) {
            throw "Secret WINDOWS_CERTIFICATE_BASE64 is not set. Refusing to produce an unsigned package."
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw "Secret WINDOWS_CERTIFICATE_PASSWORD is not set."
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [System.IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $securePassword = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword
          $expectedSubject = $env:WINDOWS_CERTIFICATE_SUBJECT
          if ([string]::IsNullOrWhiteSpace($expectedSubject)) {
            throw "Repository variable WINDOWS_CERTIFICATE_SUBJECT resolved to an empty value."
          }
          if ($cert.Subject -ne $expectedSubject) {
            throw "Imported signing certificate subject '$($cert.Subject)' does not match expected package publisher '$expectedSubject'. Update WINDOWS_CERTIFICATE_SUBJECT or replace WINDOWS_CERTIFICATE_BASE64 so they match."
          }
          Remove-Item $pfxPath -Force
          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT
          "subject=$($cert.Subject)" >> $env:GITHUB_OUTPUT
          Write-Output "Imported certificate with thumbprint $($cert.Thumbprint)."
      - name: Align package publisher with signing certificate
        if: steps.release_gate.outputs.should_release == 'true' && steps.signing.outputs.configured == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifestPath = 'src\App\Backlog.Desktop\Platforms\Windows\Package.appxmanifest'
          [xml]$manifest = Get-Content -Raw -Path $manifestPath
          $identity = $manifest.Package.Identity
          $certificateSubject = '${{ steps.cert.outputs.subject }}'
          if ([string]::IsNullOrWhiteSpace($certificateSubject)) {
            throw 'Signing certificate subject output was empty.'
          }
          if ($identity.Publisher -ne $certificateSubject) {
            Write-Output "Updating package publisher from '$($identity.Publisher)' to '$certificateSubject'."
            $identity.Publisher = $certificateSubject
            $manifest.Save((Resolve-Path $manifestPath).Path)
          }
      - name: Publish packaged MSIX
        if: steps.release_gate.outputs.should_release == 'true' && steps.signing.outputs.configured == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish src\App\Backlog.Desktop\Backlog.Desktop.csproj `
            -f net10.0-windows10.0.26100.0 `
            -c Release `
            -p:RuntimeIdentifierOverride=win-x64 `
            -p:ApplicationDisplayVersion=${{ steps.version.outputs.display }} `
            -p:ApplicationVersion=0 `
            -p:PackageCertificateThumbprint=${{ steps.cert.outputs.thumbprint }}
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed." }

      - name: Stage MSIX and generate App Installer
        if: steps.release_gate.outputs.should_release == 'true' && steps.signing.outputs.configured == 'true'
        id: stage
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $outDir = Join-Path $env:RUNNER_TEMP 'release'
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null

          $msix = Get-ChildItem -Path src\App\Backlog.Desktop -Recurse -Filter *.msix |
            Where-Object { $_.FullName -match 'AppPackages' } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $msix) {
            $msix = Get-ChildItem -Path src\App\Backlog.Desktop -Recurse -Filter *.msix |
              Sort-Object LastWriteTime -Descending | Select-Object -First 1
          }
          if (-not $msix) { throw "No .msix was produced by the publish step." }

          $msixName = '${{ steps.version.outputs.msix }}'
          $stagedMsix = Join-Path $outDir $msixName
          Copy-Item $msix.FullName $stagedMsix -Force
          Write-Output "Staged MSIX: $stagedMsix"

          $publicCertificate = Join-Path $outDir 'Backlog.Desktop.cer'
          $certificate = Get-ChildItem -LiteralPath "Cert:\CurrentUser\My\${{ steps.cert.outputs.thumbprint }}"
          if (-not $certificate) {
            throw "Imported signing certificate was not found in the current user certificate store."
          }
          Export-Certificate -Cert $certificate -FilePath $publicCertificate -Type CERT | Out-Null
          Write-Output "Staged public signing certificate: $publicCertificate"

          $appInstaller = Join-Path $outDir 'Backlog.Desktop.appinstaller'
          ./build/New-AppInstaller.ps1 `
            -Version '${{ steps.version.outputs.package }}' `
            -Tag '${{ steps.version.outputs.tag }}' `
            -MsixFileName $msixName `
            -MsixPath $stagedMsix `
            -OutputPath $appInstaller

          "dir=$outDir"                        >> $env:GITHUB_OUTPUT
          "msix=$stagedMsix"                   >> $env:GITHUB_OUTPUT
          "certificate=$publicCertificate"      >> $env:GITHUB_OUTPUT
          "appinstaller=$appInstaller"         >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        if: steps.release_gate.outputs.should_release == 'true' && steps.signing.outputs.configured == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ steps.version.outputs.tag }}'
          $msix = '${{ steps.stage.outputs.msix }}'
          $appInstaller = '${{ steps.stage.outputs.appinstaller }}'
          $certificate = '${{ steps.stage.outputs.certificate }}'

          $exists = gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target $env:GITHUB_SHA --title $tag --notes "Backlog desktop $tag" --latest $msix $appInstaller $certificate
          }
          else {
            gh release upload $tag $msix $appInstaller $certificate --clobber
            gh release edit $tag --title $tag --notes "Backlog desktop $tag" --latest
          }
          if ($LASTEXITCODE -ne 0) { throw "Publishing the release failed." }

          $url = gh release view $tag --json url --jq .url
          "### Published GitHub Release" >> $env:GITHUB_STEP_SUMMARY
          "[$tag]($url)" >> $env:GITHUB_STEP_SUMMARY
      - name: Create issue for release failure
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ISSUE_TITLE: 'Release desktop failed: run #${{ github.run_number }}'
          RELEASE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ACTOR: ${{ github.actor }}
        run: |
          $ErrorActionPreference = 'Stop'
          $bodyPath = Join-Path $env:RUNNER_TEMP 'release-failure-issue.md'
          @(
            'The desktop release workflow failed.'
            ''
            "- Run: $env:RELEASE_RUN_URL"
            "- Event: $env:RELEASE_EVENT_NAME"
            "- Ref: $env:RELEASE_REF_NAME"
            "- Commit: $env:RELEASE_SHA"
            "- Actor: $env:RELEASE_ACTOR"
            ''
            'Review the failed workflow logs and update this issue with the root cause and remediation.'
          ) | Set-Content -Path $bodyPath -Encoding utf8

          $existingIssue = gh issue list --state open --search "$env:RELEASE_ISSUE_TITLE in:title" --json number --jq '.[0].number'
          if ($LASTEXITCODE -ne 0) { throw 'Could not search for an existing release failure issue.' }

          if ([string]::IsNullOrWhiteSpace($existingIssue) -or $existingIssue -eq 'null') {
            gh issue create --title $env:RELEASE_ISSUE_TITLE --body-file $bodyPath
          }
          else {
            gh issue comment $existingIssue --body-file $bodyPath
          }
          if ($LASTEXITCODE -ne 0) { throw 'Could not create or update the release failure issue.' }
