name: Knowledge metadata

# Enforces the knowledge-folder convention: every metadata reference must
# resolve and every `meta` block must match the schema. Installed by the
# `knowledge-base-init` skill.
#
# Staleness of the committed _meta indexes is reported but does not fail the
# run — forcing every knowledge pull request to carry a regenerated index is
# what makes those files conflict on merge. Refresh is deliberate instead:
# ./build/Update-KnowledgeIndex.ps1 on demand, knowledge-meta-nightly.yml on a
# schedule. See knowledge-derived-artifacts.instructions.md.
#
# Trim the path filters to the knowledge folders this repository actually
# adopted; extra entries are harmless but noisy.

on:
  push:
    branches:
      - main
    paths:
      - '.arc42/**'
      - '.domain/**'
      - '.backlog/**'
      - '.tech/**'
      - '.design/**'
      - '.github/tools/knowledge-meta/**'
      - '.github/workflows/knowledge-meta.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.arc42/**'
      - '.domain/**'
      - '.backlog/**'
      - '.tech/**'
      - '.design/**'
      - '.github/tools/knowledge-meta/**'
      - '.github/workflows/knowledge-meta.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: knowledge-meta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Validate metadata and derived indexes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check references and metadata blocks
        run: node .github/tools/knowledge-meta/build.mjs --check

      # Advisory only. A stale index is not a defect in this pull request; the
      # nightly job reconciles it, and consumers re-read sources newer than the
      # index they read. Broken references above are the hard failure.
      - name: Report drift in the committed indexes
        run: |
          node .github/tools/knowledge-meta/build.mjs
          if ! git diff --quiet -- '*_meta/*.json'; then
            echo "::warning::Derived _meta indexes have drifted. This does not block the merge — the nightly refresh reconciles it. To refresh this branch now: ./build/Update-KnowledgeIndex.ps1"
            git --no-pager diff --stat -- '*_meta/*.json'
          fi
