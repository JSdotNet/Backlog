name: Release All

# One release of every app, under one tag. Each run builds the desktop MSIX and the
# Android APK from the same commit, deploys the sync service from it under the same
# number (the service only, never its infrastructure), and publishes the packages,
# with the App Installer file and the public signing certificate, as one GitHub
# Release vX.Y.Z.
#
# The number comes from the tags already published (build/Get-NextReleaseVersion.ps1),
# not from github.run_number: two workflows once numbered the same build v0.1.122 and
# mobile-v0.1.63 from their own counters, and a called workflow's run_number is the
# caller's. Every published release takes the next number, whatever triggered it.
#
# plan ── sync-preflight ──┬── desktop (windows-latest) ──┬── sync ── publish ── report-failure (on failure)
#                          └── mobile  (ubuntu-latest)  ──┘
#
# The server goes before the clients, and only once both packages built, so a broken
# app build never moves the server. A failed sync deploy publishes nothing and takes
# no number: the next run derives the same one.
#
# Another channel is one more build job beside desktop and mobile, an artifact the
# publish job downloads, and its precondition in the plan job.

on:
  push:
    tags:
      - 'v*'
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without the leading v (e.g. 1.2.3); blank releases the next number'
        required: false
        default: ''
        type: string

  # Called by Deploy All. Blank means the next number, as on a schedule.
  workflow_call:
    inputs:
      version:
        required: false
        default: ''
        type: string
      # The GitHub environment the sync service deploys to: Deploy All's
      # sync_environment, so one run never provisions one environment and deploys
      # the service to another. The other triggers have no inputs and use
      # production, backlog-sync.
      sync_environment:
        required: false
        default: backlog-sync
        type: string
    outputs:
      tag:
        description: 'Release tag that was published, empty when the run was gated out'
        value: ${{ jobs.publish.outputs.tag }}

permissions:
  contents: read

# Workflow-wide, not per ref: the version is read from the tags before the run
# publishes its own, so two runs at once would compute the same number. A queued run
# waits for the one publishing rather than cancelling it.
concurrency:
  group: release-all
  cancel-in-progress: false

jobs:
  # Decides once, for every channel, whether this run releases and under which number,
  # so the channels can never disagree about either.
  plan:
    name: Plan the release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      should_release: ${{ steps.version.outputs.should_release || 'false' }}
      tag: ${{ steps.version.outputs.tag }}
      display: ${{ steps.version.outputs.display }}
      package: ${{ steps.version.outputs.package }}
      code: ${{ steps.version.outputs.code }}
      msix: ${{ steps.version.outputs.msix }}
      apk: ${{ steps.version.outputs.apk }}
      nightly: ${{ steps.version.outputs.nightly }}
      sync_service_url: ${{ steps.preconditions.outputs.sync_service_url }}
    steps:
      # The full history and every tag: the gate diffs against the last release's
      # commit, and the version is derived from the tags.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Check scheduled release changes
        id: release_gate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ github.event_name }}' -ne 'schedule') {
            "changed=true" >> $env:GITHUB_OUTPUT
            Write-Output "Release requested by ${{ github.event_name }}."
            return
          }

          # The newest v* release, not the newest release: the old mobile nightlies
          # published under mobile-v* tags, and '--limit 1' answered with one of those.
          $latestTag = gh release list --limit 100 --exclude-drafts --exclude-pre-releases --json tagName --jq '[.[] | select(.tagName | test("^v[0-9]+[.][0-9]+[.][0-9]+$"))][0].tagName // empty'
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect existing GitHub releases." }

          if ([string]::IsNullOrWhiteSpace($latestTag) -or $latestTag -eq 'null') {
            "changed=true" >> $env:GITHUB_OUTPUT
            Write-Output "No existing v* release found; scheduled release will run."
            return
          }

          # A git pathspec matches a directory and everything under it, but only on a
          # path-segment boundary: 'src/Modules/Tasks/Backlog.Modules.Tasks' does not
          # match the sibling '...Backlog.Modules.Tasks.UI'. So every project a head
          # composes has to be named, and the list is derived from each head's
          # ProjectReference graph rather than hand-maintained: the hand-written lists
          # went stale twice, and a pathspec matching nothing is not an error, it just
          # reports no changes. Both app heads and the sync service are watched,
          # because one release carries all three. Only what is not a referenced
          # project is written out here. The sync infrastructure is not: Release All
          # never provisions, so an infrastructure change is a Deploy Sync run.
          $extras = @(
            'Backlog.sln',
            'azure.yaml',
            'build/Backlog.Desktop.appinstaller.template',
            'build/New-AppInstaller.ps1',
            'build/Get-ReleasePaths.ps1',
            'build/Get-NextReleaseVersion.ps1',
            '.github/workflows/release-all.yml',
            '.github/workflows/deploy-sync.yml'
          )
          $releasePaths = @(
            & ./build/Get-ReleasePaths.ps1 -HeadProject 'src/App/Backlog.Desktop/Backlog.Desktop.csproj' -Extra $extras
            & ./build/Get-ReleasePaths.ps1 -HeadProject 'src/App/Backlog.Mobile/Backlog.Mobile.csproj'
            & ./build/Get-ReleasePaths.ps1 -HeadProject 'src/Modules/Sync/Backlog.Modules.Sync.Api/Backlog.Modules.Sync.Api.csproj'
          ) | Sort-Object -Unique
          Write-Output "Release gate watches $($releasePaths.Count) paths."
          if (-not $releasePaths) {
            throw "The release path list came back empty. Refusing to continue: 'git diff -- ' with no pathspec matches every file, so the gate would report changes unconditionally."
          }
          $changedFiles = git diff --name-only "$latestTag..HEAD" -- $releasePaths
          if ($LASTEXITCODE -ne 0) { throw "Could not compare HEAD with latest release $latestTag." }

          if ($changedFiles) {
            "changed=true" >> $env:GITHUB_OUTPUT
            Write-Output "Scheduled release will run because release-relevant files changed since $latestTag."
            return
          }

          "changed=false" >> $env:GITHUB_OUTPUT
          "### Release skipped" >> $env:GITHUB_STEP_SUMMARY
          "No release-relevant changes were found since $latestTag." >> $env:GITHUB_STEP_SUMMARY

      # Every channel's preconditions, checked before anything builds. A scheduled run
      # missing any of them releases nothing, so the channels never drift apart by a
      # number; a release someone asked for fails instead.
      #
      # The APK is sideloaded and has no Settings URL field, so the address of the
      # deployed sync service is compiled into it. Without one it would fall back to
      # 10.0.2.2, the emulator's route to a developer machine, and a phone's Pair
      # button would wait on an address it can never reach. The value is the
      # SYNC_SERVICE_URI Deploy Sync prints in its step summary; it is public, so it
      # is a repository variable rather than a secret, and echoed here on purpose.
      - name: Check release preconditions
        if: steps.release_gate.outputs.changed == 'true'
        id: preconditions
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          BACKLOG_SYNC_SERVICE_URL: ${{ vars.BACKLOG_SYNC_SERVICE_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          $required = [ordered]@{
            WINDOWS_CERTIFICATE_BASE64   = $env:WINDOWS_CERTIFICATE_BASE64
            WINDOWS_CERTIFICATE_PASSWORD = $env:WINDOWS_CERTIFICATE_PASSWORD
            ANDROID_KEYSTORE_BASE64      = $env:ANDROID_KEYSTORE_BASE64
            ANDROID_KEYSTORE_PASSWORD    = $env:ANDROID_KEYSTORE_PASSWORD
            ANDROID_KEY_ALIAS            = $env:ANDROID_KEY_ALIAS
            ANDROID_KEY_PASSWORD         = $env:ANDROID_KEY_PASSWORD
            BACKLOG_SYNC_SERVICE_URL     = "$env:BACKLOG_SYNC_SERVICE_URL".Trim()
          }
          $missing = @($required.Keys | Where-Object { [string]::IsNullOrWhiteSpace($required[$_]) })

          if ($missing.Count -gt 0) {
            "configured=false" >> $env:GITHUB_OUTPUT
            if ('${{ github.event_name }}' -eq 'schedule') {
              "### Release skipped" >> $env:GITHUB_STEP_SUMMARY
              "Not configured: $($missing -join ', '). No channel was released, so the desktop and mobile numbers stay aligned. Signing secrets keep a package from shipping unsigned; BACKLOG_SYNC_SERVICE_URL is where the APK finds the sync service." >> $env:GITHUB_STEP_SUMMARY
              Write-Output "Not configured: $($missing -join ', '). Skipping the scheduled release."
              return
            }

            throw "Not configured: $($missing -join ', '). Refusing to produce an unsigned package or an APK that cannot reach the sync service."
          }

          # A release never ships a developer address: https only, and none of the
          # hosts that mean "this machine" or "the emulator's host".
          $value = $required.BACKLOG_SYNC_SERVICE_URL
          $uri = $null
          if (-not [Uri]::TryCreate($value, [UriKind]::Absolute, [ref]$uri) -or $uri.Scheme -ne 'https') {
            throw "BACKLOG_SYNC_SERVICE_URL must be an absolute https URL (got '$value')."
          }
          if ($uri.IsLoopback -or $uri.Host -eq '10.0.2.2') {
            throw "BACKLOG_SYNC_SERVICE_URL points at a development host ('$($uri.Host)'). Refusing to ship it in a release."
          }

          "configured=true" >> $env:GITHUB_OUTPUT
          "sync_service_url=$($uri.AbsoluteUri)" >> $env:GITHUB_OUTPUT
          "### Sync service" >> $env:GITHUB_STEP_SUMMARY
          "The APK talks to $($uri.AbsoluteUri)." >> $env:GITHUB_STEP_SUMMARY
          Write-Output "Signing secrets are configured. Sync service address: $($uri.AbsoluteUri)"

      # Only once the run is known to release, so a gated-out run takes no number.
      - name: Derive version numbers
        if: steps.preconditions.outputs.configured == 'true'
        id: version
        shell: pwsh
        env:
          # Through env rather than spliced into the script: each is typed by a person,
          # and git allows a quote in a ref name.
          REQUESTED_VERSION: ${{ inputs.version }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          $ErrorActionPreference = 'Stop'
          $requested = "$env:REQUESTED_VERSION".Trim()
          if (-not $requested -and $env:RELEASE_REF_TYPE -eq 'tag') {
            $requested = $env:RELEASE_REF_NAME
          }
          if (-not $requested -and $env:RELEASE_REF_NAME -ne 'main') {
            throw "Unsupported release branch '$env:RELEASE_REF_NAME': only main numbers a release itself. Pass a version."
          }

          # Both namespaces: the last mobile-v* nightly is what phones have installed,
          # and the next APK's versionCode has to be higher than it.
          $tags = @(git tag --list 'v*' 'mobile-v*')
          if ($LASTEXITCODE -ne 0) { throw "Could not list the release tags." }

          $next = & ./build/Get-NextReleaseVersion.ps1 -Tag $tags -Requested $requested

          # An existing tag is republished only from its own commit: from any other, the
          # same MSIX version and versionCode would carry a different build, which no
          # installed device picks up. Checked here so it fails before anything builds,
          # and again in the publish job, which a re-run of failed jobs reaches with
          # this job's old outputs.
          if ($tags -contains $next.Tag) {
            $tagCommit = git rev-list -n 1 $next.Tag
            if ($LASTEXITCODE -ne 0) { throw "Could not resolve the commit of $($next.Tag)." }
            if ($tagCommit -ne $env:GITHUB_SHA) {
              throw "$($next.Tag) already exists at $tagCommit, not at this run's commit $env:GITHUB_SHA. Release a higher version instead."
            }
          }

          "should_release=true"                             >> $env:GITHUB_OUTPUT
          "tag=$($next.Tag)"                                >> $env:GITHUB_OUTPUT
          "display=$($next.Display)"                        >> $env:GITHUB_OUTPUT
          "package=$($next.Package)"                        >> $env:GITHUB_OUTPUT
          "code=$($next.VersionCode)"                       >> $env:GITHUB_OUTPUT
          "msix=Backlog.Desktop_$($next.Package)_x64.msix"  >> $env:GITHUB_OUTPUT
          "apk=Backlog.Mobile_$($next.Display).apk"         >> $env:GITHUB_OUTPUT
          # A nightly is a version this run numbered itself, not one a tag, a
          # dispatch or Deploy All asked for. Publish keys Latest on it.
          "nightly=$($next.Derived.ToString().ToLower())"   >> $env:GITHUB_OUTPUT
          "### Release $($next.Tag)" >> $env:GITHUB_STEP_SUMMARY
          "MSIX $($next.Package), APK versionCode $($next.VersionCode), numbered $(if ($next.Derived) { 'from the existing tags' } else { "as requested ($requested)" })." >> $env:GITHUB_STEP_SUMMARY
          Write-Output "Tag=$($next.Tag) Display=$($next.Display) Package=$($next.Package) VersionCode=$($next.VersionCode) Nightly=$($next.Derived)"

  # The sync service's settings live on the backlog-sync environment, and only a job
  # that declares it can read them, so this job declares it rather than the plan job,
  # which holds the signing secrets. It runs after the change gate, so an unchanged
  # night does not touch the environment. Their shape (GUIDs, key length) is checked
  # once, by Deploy Sync's own Verify step; this checks only that they are there.
  sync-preflight:
    name: Check the sync service environment
    needs: plan
    if: needs.plan.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.sync_environment || 'backlog-sync' }}
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check the sync service environment
        id: check
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          # Only its presence is read; the value is never printed.
          SYNC_TOKEN_SIGNING_KEY: ${{ secrets.SYNC_TOKEN_SIGNING_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $required = [ordered]@{
            AZURE_CLIENT_ID        = $env:AZURE_CLIENT_ID
            AZURE_TENANT_ID        = $env:AZURE_TENANT_ID
            AZURE_SUBSCRIPTION_ID  = $env:AZURE_SUBSCRIPTION_ID
            AZURE_RESOURCE_GROUP   = $env:AZURE_RESOURCE_GROUP
            AZURE_LOCATION         = $env:AZURE_LOCATION
            SYNC_TOKEN_SIGNING_KEY = $env:SYNC_TOKEN_SIGNING_KEY
          }
          $missing = @($required.Keys | Where-Object { [string]::IsNullOrWhiteSpace($required[$_]) })

          if ($missing.Count -eq 0) {
            "configured=true" >> $env:GITHUB_OUTPUT
            Write-Output "The backlog-sync environment is configured."
            return
          }

          "configured=false" >> $env:GITHUB_OUTPUT
          if ('${{ github.event_name }}' -eq 'schedule') {
            "### Release skipped" >> $env:GITHUB_STEP_SUMMARY
            "Not configured on the backlog-sync environment: $($missing -join ', '). Nothing was released, the apps included, so the apps and the sync service keep one number. See docs/deployment/sync.md." >> $env:GITHUB_STEP_SUMMARY
            Write-Output "Not configured on backlog-sync: $($missing -join ', '). Skipping the scheduled release."
            return
          }

          throw "Not configured on the backlog-sync environment: $($missing -join ', '). Refusing to release apps whose sync service cannot be deployed under the same number."

  desktop:
    name: Build and sign the MSIX
    needs: [plan, sync-preflight]
    if: needs.sync-preflight.outputs.configured == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows

      - name: Import code-signing certificate
        id: cert
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_SUBJECT: ${{ vars.WINDOWS_CERTIFICATE_SUBJECT || 'CN=Backlog Desktop Test Signing' }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) {
            throw "Secret WINDOWS_CERTIFICATE_BASE64 is not set. Refusing to produce an unsigned package."
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw "Secret WINDOWS_CERTIFICATE_PASSWORD is not set."
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [System.IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $securePassword = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword
          $expectedSubject = $env:WINDOWS_CERTIFICATE_SUBJECT
          if ([string]::IsNullOrWhiteSpace($expectedSubject)) {
            throw "Repository variable WINDOWS_CERTIFICATE_SUBJECT resolved to an empty value."
          }
          if ($cert.Subject -ne $expectedSubject) {
            throw "Imported signing certificate subject '$($cert.Subject)' does not match expected package publisher '$expectedSubject'. Update WINDOWS_CERTIFICATE_SUBJECT or replace WINDOWS_CERTIFICATE_BASE64 so they match."
          }
          Remove-Item $pfxPath -Force
          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT
          "subject=$($cert.Subject)" >> $env:GITHUB_OUTPUT
          Write-Output "Imported certificate with thumbprint $($cert.Thumbprint)."

      - name: Align package publisher with signing certificate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifestPath = 'src\App\Backlog.Desktop\Platforms\Windows\Package.appxmanifest'
          [xml]$manifest = Get-Content -Raw -Path $manifestPath
          $identity = $manifest.Package.Identity
          $certificateSubject = '${{ steps.cert.outputs.subject }}'
          if ([string]::IsNullOrWhiteSpace($certificateSubject)) {
            throw 'Signing certificate subject output was empty.'
          }
          if ($identity.Publisher -ne $certificateSubject) {
            Write-Output "Updating package publisher from '$($identity.Publisher)' to '$certificateSubject'."
            $identity.Publisher = $certificateSubject
            $manifest.Save((Resolve-Path $manifestPath).Path)
          }

      - name: Publish packaged MSIX
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish src\App\Backlog.Desktop\Backlog.Desktop.csproj `
            -f net10.0-windows10.0.26100.0 `
            -c Release `
            -p:RuntimeIdentifierOverride=win-x64 `
            -p:ApplicationDisplayVersion=${{ needs.plan.outputs.display }} `
            -p:ApplicationVersion=0 `
            -p:PackageCertificateThumbprint=${{ steps.cert.outputs.thumbprint }}
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed." }

      - name: Stage MSIX and generate App Installer
        id: stage
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $outDir = Join-Path $env:RUNNER_TEMP 'release'
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null

          $msix = Get-ChildItem -Path src\App\Backlog.Desktop -Recurse -Filter *.msix |
            Where-Object { $_.FullName -match 'AppPackages' } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $msix) {
            $msix = Get-ChildItem -Path src\App\Backlog.Desktop -Recurse -Filter *.msix |
              Sort-Object LastWriteTime -Descending | Select-Object -First 1
          }
          if (-not $msix) { throw "No .msix was produced by the publish step." }

          $msixName = '${{ needs.plan.outputs.msix }}'
          $stagedMsix = Join-Path $outDir $msixName
          Copy-Item $msix.FullName $stagedMsix -Force
          Write-Output "Staged MSIX: $stagedMsix"

          $publicCertificate = Join-Path $outDir 'Backlog.Desktop.cer'
          $certificate = Get-ChildItem -LiteralPath "Cert:\CurrentUser\My\${{ steps.cert.outputs.thumbprint }}"
          if (-not $certificate) {
            throw "Imported signing certificate was not found in the current user certificate store."
          }
          Export-Certificate -Cert $certificate -FilePath $publicCertificate -Type CERT | Out-Null
          Write-Output "Staged public signing certificate: $publicCertificate"

          # Its Uri is releases/latest/download/Backlog.Desktop.appinstaller, so it is
          # read from whichever release holds Latest; every release carries one.
          $appInstaller = Join-Path $outDir 'Backlog.Desktop.appinstaller'
          ./build/New-AppInstaller.ps1 `
            -Version '${{ needs.plan.outputs.package }}' `
            -Tag '${{ needs.plan.outputs.tag }}' `
            -MsixFileName $msixName `
            -MsixPath $stagedMsix `
            -OutputPath $appInstaller

          "dir=$outDir" >> $env:GITHUB_OUTPUT

      - name: Upload the desktop packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-desktop
          path: ${{ steps.stage.outputs.dir }}
          if-no-files-found: error
          retention-days: 1

  mobile:
    name: Build and sign the Android APK
    needs: [plan, sync-preflight]
    if: needs.sync-preflight.outputs.configured == 'true'
    # Android heads build on Linux and the runner image ships the Android SDK, so
    # this channel does not need the windows-latest runner the MSIX flow requires.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Setup JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK components
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdkRoot = $env:ANDROID_HOME
          if ([string]::IsNullOrWhiteSpace($sdkRoot)) { $sdkRoot = $env:ANDROID_SDK_ROOT }
          if ([string]::IsNullOrWhiteSpace($sdkRoot)) { throw "Neither ANDROID_HOME nor ANDROID_SDK_ROOT is set on this runner." }

          $sdkManager = Join-Path $sdkRoot 'cmdline-tools/latest/bin/sdkmanager'
          if (-not (Test-Path -LiteralPath $sdkManager)) { throw "sdkmanager was not found at $sdkManager." }

          # net10.0-android targets API 36; install it explicitly rather than relying
          # on whatever the runner image happens to preinstall this month.
          & $sdkManager --install 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
          if ($LASTEXITCODE -ne 0) { throw "Installing Android SDK components failed." }

          "ANDROID_HOME=$sdkRoot" >> $env:GITHUB_ENV
          "ANDROID_SDK_ROOT=$sdkRoot" >> $env:GITHUB_ENV

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore signing keystore
        id: keystore
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:ANDROID_KEYSTORE_BASE64)) {
            throw "Secret ANDROID_KEYSTORE_BASE64 is not set. Refusing to produce an unsigned package."
          }
          $keystorePath = Join-Path $env:RUNNER_TEMP 'backlog-android.keystore'
          try {
            $bytes = [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64.Trim())
          }
          catch {
            throw "ANDROID_KEYSTORE_BASE64 is not valid base64: $($_.Exception.Message)"
          }
          if ($bytes.Length -eq 0) { throw "ANDROID_KEYSTORE_BASE64 decoded to an empty file." }
          [System.IO.File]::WriteAllBytes($keystorePath, $bytes)
          "path=$keystorePath" >> $env:GITHUB_OUTPUT
          Write-Output "Restored keystore to $keystorePath ($($bytes.Length) bytes)."

      - name: Publish signed APK
        shell: pwsh
        env:
          # Passed by name through the env: prefix so the passwords never appear in
          # the MSBuild command line or the runner process table.
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          # Through env, as the signing values are, rather than spliced into the
          # script: it started life as a repository variable someone typed. The plan
          # job validated it.
          BACKLOG_SYNC_SERVICE_URL: ${{ needs.plan.outputs.sync_service_url }}
          # The update channel: the repository whose releases the installed APK
          # checks for a newer one (ApkUpdateChannel). Only this job sets it,
          # because only its APKs carry the release key a later release can update;
          # a build without it - Install-AndroidApp.ps1, a debug deploy - reports
          # that it cannot update itself.
          BACKLOG_UPDATE_REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:BACKLOG_SYNC_SERVICE_URL)) {
            throw "The plan job passed no sync service address. Refusing to produce an APK that cannot reach the sync service."
          }
          # APK, not AAB: this package is sideloaded from GitHub Releases straight onto
          # a device, and .aab is only consumable by Google Play.
          dotnet publish src/App/Backlog.Mobile/Backlog.Mobile.csproj `
            -f net10.0-android `
            -c Release `
            -p:AndroidPackageFormat=apk `
            -p:ApplicationDisplayVersion=${{ needs.plan.outputs.display }} `
            -p:ApplicationVersion=${{ needs.plan.outputs.code }} `
            "-p:BacklogSyncServiceUrl=$env:BACKLOG_SYNC_SERVICE_URL" `
            "-p:BacklogUpdateRepository=$env:BACKLOG_UPDATE_REPOSITORY" `
            -p:AndroidKeyStore=true `
            "-p:AndroidSigningKeyStore=$env:KEYSTORE_PATH" `
            "-p:AndroidSigningKeyAlias=$env:ANDROID_KEY_ALIAS" `
            -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD `
            -p:AndroidSigningKeyPass=env:ANDROID_KEY_PASSWORD
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed." }

      - name: Stage and verify the signed APK
        id: stage
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $outDir = Join-Path $env:RUNNER_TEMP 'release'
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null

          $apk = Get-ChildItem -Path 'src/App/Backlog.Mobile/bin/Release' -Recurse -Filter '*-Signed.apk' -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $apk) { throw "No signed .apk was produced by the publish step." }

          $stagedApk = Join-Path $outDir '${{ needs.plan.outputs.apk }}'
          Copy-Item $apk.FullName $stagedApk -Force
          Write-Output "Staged APK: $stagedApk"

          # Belt and braces: prove the artifact really is signed before publishing it.
          $buildTools = Join-Path $env:ANDROID_HOME 'build-tools'
          $apkSigner = Get-ChildItem -Path $buildTools -Recurse -Filter 'apksigner' -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $apkSigner) { throw "apksigner was not found under $buildTools; cannot verify the APK signature." }

          & $apkSigner.FullName verify --verbose $stagedApk
          if ($LASTEXITCODE -ne 0) { throw "apksigner could not verify the signature of $stagedApk. Refusing to publish an unsigned package." }

          "dir=$outDir" >> $env:GITHUB_OUTPUT

      - name: Upload the mobile package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-mobile
          path: ${{ steps.stage.outputs.dir }}
          if-no-files-found: error
          retention-days: 1

      - name: Remove signing keystore
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $keystorePath = Join-Path $env:RUNNER_TEMP 'backlog-android.keystore'
          if (Test-Path -LiteralPath $keystorePath) {
            Remove-Item -LiteralPath $keystorePath -Force
            Write-Output "Removed $keystorePath."
          }

  # The sync service under the release number, through Deploy Sync's `service` mode:
  # the container only, never a preview or provision. Deploy Sync reads GET / back
  # and fails unless it reports this release at this commit, so publish never runs
  # against a service that did not take the number.
  sync:
    name: Deploy the sync service
    needs: [plan, sync-preflight, desktop, mobile]
    if: needs.sync-preflight.outputs.configured == 'true'
    uses: ./.github/workflows/deploy-sync.yml
    permissions:
      contents: read
      # The OIDC federated credential Deploy Sync signs in to Azure with.
      id-token: write
    # Inherit, as Deploy All does: SYNC_TOKEN_SIGNING_KEY is an environment secret,
    # resolved by the called workflow's job, which declares the environment.
    secrets: inherit
    with:
      mode: service
      environment_name: ${{ inputs.sync_environment || 'backlog-sync' }}
      # Deploy Sync refuses the deploy when this tag already exists at another
      # commit: a re-run of failed jobs repeats that job, not this run's plan.
      release_tag: ${{ needs.plan.outputs.tag }}
      # GET /'s `release`, not its `version`: that is the compatibility number
      # clients stop syncing above, and a release never moves it.
      release: ${{ needs.plan.outputs.display }}

  # Runs only when every channel built and the service took the number, so a release
  # is never published with one package missing.
  publish:
    name: Publish the GitHub Release
    needs: [plan, sync-preflight, desktop, mobile, sync]
    if: needs.sync-preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
    steps:
      - name: Download the packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: ${{ runner.temp }}/release

      - name: Publish GitHub Release
        id: publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout in this job, so gh is told the repository.
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'release'
          $tag = '${{ needs.plan.outputs.tag }}'
          $msix = Join-Path $dir '${{ needs.plan.outputs.msix }}'
          $appInstaller = Join-Path $dir 'Backlog.Desktop.appinstaller'
          $certificate = Join-Path $dir 'Backlog.Desktop.cer'
          $apk = Join-Path $dir '${{ needs.plan.outputs.apk }}'
          $nightly = '${{ needs.plan.outputs.nightly }}' -eq 'true'

          # The release that holds Latest is the one App Installer reads its file
          # from, so a release missing a package is never published at all.
          foreach ($asset in @($msix, $appInstaller, $certificate, $apk)) {
            if (-not (Test-Path -LiteralPath $asset)) {
              throw "Release asset '$asset' is missing. Refusing to publish $tag without every package."
            }
          }

          # Latest is the App Installer update channel (releases/latest/download).
          # An explicit release always takes it; a nightly takes it only when no
          # higher version holds it, so it never demotes a real release. A rerun
          # of the same version keeps it. The phone ignores Latest: it reads every
          # release and picks the highest versionCode.
          if (-not $nightly) {
            $latest = '--latest'
            $reason = 'an explicit release always takes Latest'
          }
          else {
            $current = (gh release view --json tagName --jq .tagName 2>&1 | Out-String).Trim()
            if ($LASTEXITCODE -ne 0 -and $current -match 'release not found') {
              $latest = '--latest'
              $reason = 'no release holds Latest yet'
            }
            elseif ($LASTEXITCODE -ne 0 -or -not ($current -match '^v(\d+\.\d+\.\d+)$')) {
              $latest = '--latest=false'
              $reason = "the current Latest release could not be read ($current), so the nightly stays off it"
            }
            elseif ([version]'${{ needs.plan.outputs.display }}' -ge [version]$Matches[1]) {
              $latest = '--latest'
              $reason = "the nightly is not lower than the current Latest, $current"
            }
            else {
              $latest = '--latest=false'
              $reason = "the current Latest, $current, is a higher version"
            }
          }
          "### Latest release" >> $env:GITHUB_STEP_SUMMARY
          "``$latest``: $reason." >> $env:GITHUB_STEP_SUMMARY

          # Numbers come from the tags, so two runs can plan the same one. When an
          # older failed run is re-run after a newer run published that number, its
          # plan outputs are reused and the tag exists now: clobbering would swap the
          # newer build for the older under the same MSIX version and versionCode,
          # which no installed device would ever pick up. So an existing tag is
          # republished only from its own commit - a true re-run - and refused otherwise.
          $tagCommit = (gh api "repos/$env:GH_REPO/commits/refs/tags/$tag" --jq .sha 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -eq 0) {
            if ($tagCommit -ne $env:GITHUB_SHA) {
              throw "$tag already exists at $tagCommit, not at this run's commit $env:GITHUB_SHA. A newer run has published this number; release a higher version instead of re-running this one."
            }
          }
          elseif ($tagCommit -notmatch 'No commit found') {
            throw "Could not resolve the commit of an existing $tag ($tagCommit)."
          }

          $exists = gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target $env:GITHUB_SHA --title $tag --notes "Backlog $tag" $latest $msix $appInstaller $certificate $apk
          }
          else {
            gh release upload $tag $msix $appInstaller $certificate $apk --clobber
            if ($LASTEXITCODE -ne 0) { throw "Uploading to the existing release $tag failed." }
            gh release edit $tag --title $tag --notes "Backlog $tag" $latest
          }
          if ($LASTEXITCODE -ne 0) { throw "Publishing the release failed." }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          $url = gh release view $tag --json url --jq .url
          "### Published GitHub Release" >> $env:GITHUB_STEP_SUMMARY
          "[$tag]($url)" >> $env:GITHUB_STEP_SUMMARY

  report-failure:
    name: Report a failed release
    needs: [plan, sync-preflight, desktop, mobile, sync, publish]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      issues: write
    steps:
      - name: Create issue for release failure
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # The run id, not run_number: inside Deploy All, run_number is Deploy All's
          # counter, and a title keyed on it could land on another workflow's issue.
          RELEASE_ISSUE_TITLE: 'Release All failed (${{ github.workflow }}): run ${{ github.run_id }}'
          RELEASE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ACTOR: ${{ github.actor }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_VERSION: ${{ needs.plan.outputs.display }}
          RELEASE_SYNC_RESULT: ${{ needs.sync.result }}
          RELEASE_PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          $ErrorActionPreference = 'Stop'
          $bodyPath = Join-Path $env:RUNNER_TEMP 'release-failure-issue.md'
          @(
            'The Release All workflow failed.'
            ''
            "- Run: $env:RELEASE_RUN_URL"
            "- Event: $env:RELEASE_EVENT_NAME"
            "- Ref: $env:RELEASE_REF_NAME"
            "- Commit: $env:RELEASE_SHA"
            "- Actor: $env:RELEASE_ACTOR"
            "- Release tag: $(if ($env:RELEASE_TAG) { $env:RELEASE_TAG } else { '(not numbered)' })"
            "- Sync service: $(if ($env:RELEASE_SYNC_RESULT -eq 'success') { "already deployed at $env:RELEASE_VERSION" } else { "deploy failed or unverified ($env:RELEASE_SYNC_RESULT) - the container may already serve this number; check GET /" })"
            ''
            $(if ($env:RELEASE_SYNC_RESULT -eq 'success' -and $env:RELEASE_PUBLISH_RESULT -ne 'success') { 'The service runs a number no release carries yet. The next run derives the same number and redeploys over it; fix forward or re-run.'; '' })
            'Review the failed workflow logs and update this issue with the root cause and remediation.'
          ) | Set-Content -Path $bodyPath -Encoding utf8

          $existingIssue = gh issue list --state open --search "$env:RELEASE_ISSUE_TITLE in:title" --json number --jq '.[0].number'
          if ($LASTEXITCODE -ne 0) { throw 'Could not search for an existing release failure issue.' }

          if ([string]::IsNullOrWhiteSpace($existingIssue) -or $existingIssue -eq 'null') {
            gh issue create --title $env:RELEASE_ISSUE_TITLE --body-file $bodyPath
          }
          else {
            gh issue comment $existingIssue --body-file $bodyPath
          }
          if ($LASTEXITCODE -ne 0) { throw 'Could not create or update the release failure issue.' }
