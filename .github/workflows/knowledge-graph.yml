name: Knowledge graph

on:
  push:
    branches:
      - main
    paths:
      - '.arc42/**'
      - '.domain/**'
      - '.backlog/**'
      - '.tech/**'
      - '.github/tools/knowledge-graph/**'
      - '.github/extensions/knowledge-canvas/metadata.mjs'
      - '.github/workflows/knowledge-graph.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.arc42/**'
      - '.domain/**'
      - '.backlog/**'
      - '.tech/**'
      - '.github/tools/knowledge-graph/**'
      - '.github/extensions/knowledge-canvas/metadata.mjs'
      - '.github/workflows/knowledge-graph.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: knowledge-graph-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Validate cross-references
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check knowledge graph references
        run: node .github/tools/knowledge-graph/build-graph.mjs --check

      - name: Check committed index is up to date
        run: |
          node .github/tools/knowledge-graph/build-graph.mjs
          if ! git diff --quiet -- .index/knowledge-graph.json; then
            echo "::error::.index/knowledge-graph.json is stale. Run: node .github/tools/knowledge-graph/build-graph.mjs"
            git --no-pager diff --stat -- .index/knowledge-graph.json
            exit 1
          fi
