name: Auto-merge

# Turns on GitHub auto-merge for every pull request that is not a draft, so it
# merges once the required checks of the "main: required checks" ruleset pass.
# GitHub does the waiting: this job finishes in seconds and holds no runner
# while the builds run. An earlier version polled the head commit's check runs
# from a runner for up to an hour; seventeen pull requests marked ready at once
# held enough runners that their own builds were never picked up, and the
# cancelled builds read as failures.
#
# Only required checks gate the merge. A check that should block one belongs in
# the ruleset, not here.
#
# Draft pull requests are skipped, and marking one ready for review turns
# auto-merge on. Converting a pull request back to a draft turns it off.
#
# A merge made with the default GITHUB_TOKEN does not trigger the push
# workflows on the base branch, so auto-merge is enabled with the
# AUTO_MERGE_TOKEN secret (a fine-grained token with Contents and Pull requests
# read/write) when the repository has one, and with GITHUB_TOKEN when it does
# not.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  merge:
    name: Enable auto-merge
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN || github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        # --match-head-commit refuses to arm a commit that is no longer the
        # head; the run for the newer commit arms that one instead.
        run: gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --auto --merge --match-head-commit "$SHA"

  back-to-draft:
    name: Turn off auto-merge for a draft
    if: ${{ github.event.action == 'converted_to_draft' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Disable auto-merge
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN || github.token }}
        run: gh pr merge "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" --disable-auto || true
