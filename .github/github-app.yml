# Bootstrap repository baseline. Replace the pre_flight section with solution-specific
# restore/build/test commands once the implementation scaffold exists.
automation:
  auto_issue_session: false
  remote_control: false

instructions: |
  Use the repository account for GitHub operations in this repository.
  Follow .github/copilot-instructions.md and .github/instructions/*.instructions.md for MCP server usage and agent routing.

mcp_servers:
  - name: jsdotnet-project-guidelines
    command: jsdotnet-guidelines-mcpserver
    tools: ["*"]
  - name: jsdotnet-project-design
    command: jsdotnet-design-mcpserver
    tools: ["*"]

