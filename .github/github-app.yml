# Repository baseline for the GitHub Copilot Coding Agent.
automation:
  auto_issue_session: false
  remote_control: false

instructions: |
  Use the repository account for GitHub operations in this repository.
  Follow .github/copilot-instructions.md and .github/instructions/*.instructions.md for MCP server usage and agent routing.
  Repository guidance is checked in, not fetched: read .arc42/guidelines/ and .arc42/adr/ for decisions and .design/ for design guidance.
  For any orch-* workflow, run the matching skill through the copilot-app:orchestrator agent,
  open or reattach the orch-dashboard when available, and keep QA Validation in the shared
  phase sequence for code-modifying work. Do not mark orchestration complete until Personal
  Validation is explicitly approved by the user.
# The jsdotnet-project-guidelines and jsdotnet-project-design servers were removed on
# 2026-08-27. Their guidance is checked in: .arc42/guidelines/ (inherited architecture
# decisions), .arc42/adr/ (local ones), and .design/ (design and UX).
mcp_servers:
  - name: aspire
    command: aspire
    args: ["agent", "mcp"]
    tools: ["*"]

# Mirrors .github/workflows/pull-request.yml. The MAUI heads in src/App require the
# win-x64 / WindowsPackageType flags below; without them restore and build fail.
pre_flight:
  - name: Restore dependencies
    run: >
      dotnet restore Backlog.sln
      -p:RuntimeIdentifierOverride=win-x64
      -p:WindowsPackageType=None
      -p:AppxPackageSigningEnabled=false
      -p:GenerateAppxPackageOnBuild=false

  - name: Build (compile)
    run: >
      dotnet build Backlog.sln
      --no-restore
      --configuration Release
      -p:RuntimeIdentifierOverride=win-x64
      -p:WindowsPackageType=None
      -p:AppxPackageSigningEnabled=false
      -p:GenerateAppxPackageOnBuild=false

  # Microsoft.Testing.Platform, opted into by global.json when the suite moved to
  # xunit v3. The options mirror pull-request.yml -- see the comment there for what
  # each one replaces. MTP swallows an option it does not recognise and then runs
  # nothing, exiting 5 with "Zero tests ran", so a stale flag here is a pre-flight
  # that never tested anything.
  - name: Run tests
    run: >
      dotnet test
      --solution Backlog.sln
      --no-build
      --configuration Release
      --max-parallel-test-modules 1
      --results-directory TestResults
      --report-trx
      --parallel none
      -p:RuntimeIdentifierOverride=win-x64
      -p:WindowsPackageType=None
      -p:AppxPackageSigningEnabled=false
      -p:GenerateAppxPackageOnBuild=false
