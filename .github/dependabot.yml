version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    labels:
      - dependencies
      - github-actions
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Every NuGet version sits in the central Directory.Packages.props at the root.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    labels:
      - enhancement
    open-pull-requests-limit: 5
    groups:
      aspire:
        patterns:
          - Aspire.*
      maui:
        patterns:
          - Microsoft.Maui.*
          - Microsoft.AspNetCore.Components.WebView.Maui
      microsoft:
        patterns:
          - Microsoft.Extensions.*
      azure:
        patterns:
          - Azure.*
      test:
        patterns:
          - xunit.*
          - bunit
          - Microsoft.Testing.*
      # ModelContextProtocol.AspNetCore pins ModelContextProtocol to its own exact version,
      # so bumping one alone is an NU1107 conflict in Backlog.Desktop.
      mcp:
        patterns:
          - ModelContextProtocol*
    ignore:
      # MauiVersion in Directory.Build.props owns these; they move in lockstep with the workload.
      - dependency-name: Microsoft.Maui.*
      - dependency-name: Microsoft.AspNetCore.Components.WebView.Maui
      # The Aspire family moves in lockstep: Aspire.Hosting.Foundry and Aspire.Hosting.Maui ship
      # one preview build per Aspire release and bind against the Aspire.Hosting the AppHost
      # resolves. A major Aspire move also rewrites the AppHost by hand (Aspire 17 retired
      # Aspire.AppHost.Sdk and AddProject), so it is an attended flow-code run, never a grouped PR.
      - dependency-name: Aspire.*
        update-types:
          - version-update:semver-major
      # Pinned to the version Aspire.Microsoft.Azure.Cosmos resolves (Directory.Packages.props):
      # it moves with that package, by hand, never on its own.
      - dependency-name: Microsoft.Azure.Cosmos

  - package-ecosystem: npm
    directory: /src/App/Backlog.Ide.VsCode
    schedule:
      interval: weekly
    labels:
      - enhancement
    open-pull-requests-limit: 5

